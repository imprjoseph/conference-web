<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會議網站管理後台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* CSS 樣式 */
        :root {
            --primary-color: #1e40af;
            --primary-light: #3b82f6;
            --primary-dark: #1e3a8a;
            --secondary-color: #64748b;
            --accent-color: #f59e0b;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --text-color: #1f2937;
            --text-light: #6b7280;
            --bg-color: #ffffff;
            --bg-light: #f8fafc;
            --bg-gray: #f1f5f9;
            --border-color: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --border-radius: 8px;
            --border-radius-lg: 12px;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--bg-light);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 載入動畫 */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 200px;
            flex-direction: column;
            gap: 20px;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border-color);
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 登入頁面 */
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary-color) 100%);
        }

        .login-card {
            background: var(--bg-color);
            border-radius: var(--border-radius-lg);
            padding: 40px;
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 400px;
        }

        .login-title {
            text-align: center;
            margin-bottom: 30px;
            font-size: 24px;
            font-weight: 600;
            color: var(--text-color);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-color);
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            font-size: 16px;
            transition: var(--transition);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.1);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: var(--border-radius);
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: var(--transition);
            border: none;
            cursor: pointer;
            width: 100%;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
        }

        .btn-success {
            background-color: var(--success-color);
            color: white;
        }

        .btn-success:hover {
            background-color: #059669;
        }

        .btn-danger {
            background-color: var(--danger-color);
            color: white;
        }

        .btn-danger:hover {
            background-color: #dc2626;
        }

        .btn-outline {
            background-color: transparent;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
        }

        .btn-outline:hover {
            background-color: var(--primary-color);
            color: white;
        }

        .login-error {
            background-color: #fef2f2;
            color: var(--danger-color);
            padding: 12px;
            border-radius: var(--border-radius);
            margin-bottom: 20px;
            border: 1px solid #fecaca;
        }

        /* 管理介面 */
        .admin-header {
            background: var(--bg-color);
            border-bottom: 1px solid var(--border-color);
            padding: 20px 0;
            margin-bottom: 30px;
        }

        .admin-header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-title {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-color);
        }

        .admin-user {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-light);
        }

        .admin-nav {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        .admin-nav-btn {
            padding: 12px 24px;
            background: none;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-weight: 500;
            color: var(--text-light);
            transition: var(--transition);
        }

        .admin-nav-btn.active {
            background-color: var(--primary-color);
            color: white;
        }

        .admin-nav-btn:hover {
            background-color: var(--bg-gray);
            color: var(--text-color);
        }

        /* 卡片容器 */
        .card {
            background: var(--bg-color);
            border-radius: var(--border-radius-lg);
            padding: 30px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        .card-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* 設定表單 */
        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .settings-group {
            background: var(--bg-light);
            padding: 20px;
            border-radius: var(--border-radius);
            border: 1px solid var(--border-color);
        }

        .settings-group-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-color);
        }

        /* 資料列表 */
        .data-list {
            margin-top: 20px;
        }

        .data-item {
            background: var(--bg-light);
            border-radius: var(--border-radius);
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
        }

        .data-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .data-item-title {
            font-weight: 600;
            color: var(--text-color);
        }

        .data-item-actions {
            display: flex;
            gap: 8px;
        }

        .data-item-action {
            padding: 6px 12px;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-size: 14px;
            transition: var(--transition);
        }

        .data-item-action.edit {
            background-color: var(--primary-color);
            color: white;
        }

        .data-item-action.edit:hover {
            background-color: var(--primary-dark);
        }

        .data-item-action.delete {
            background-color: var(--danger-color);
            color: white;
        }

        .data-item-action.delete:hover {
            background-color: #dc2626;
        }

        .data-item-action.add {
            background-color: var(--success-color);
            color: white;
        }

        .data-item-action.add:hover {
            background-color: #059669;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: var(--bg-color);
            border-radius: var(--border-radius-lg);
            padding: 30px;
            max-width: 800px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text-color);
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-light);
        }

        .modal-body {
            margin-bottom: 30px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        /* 表單 */
        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-full {
            grid-column: 1 / -1;
        }

        .form-textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            font-size: 16px;
            min-height: 100px;
            resize: vertical;
            font-family: inherit;
            transition: var(--transition);
        }

        .form-textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.1);
        }

        .form-select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            font-size: 16px;
            background: var(--bg-color);
            transition: var(--transition);
        }

        .form-select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.1);
        }

        .form-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-checkbox input {
            margin: 0;
        }

        /* 狀態指示器 */
        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
        }

        .status-draft {
            background-color: #fef3c7;
            color: #d97706;
        }

        .status-live {
            background-color: #d1fae5;
            color: #059669;
        }

        .status-closed {
            background-color: #fee2e2;
            color: #dc2626;
        }

        .status-coming-soon {
            background-color: #dbeafe;
            color: #2563eb;
        }

        .status-open {
            background-color: #d1fae5;
            color: #059669;
        }

        /* 響應式設計 */
        @media (max-width: 768px) {
            .admin-header-content {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .admin-nav {
                flex-wrap: wrap;
                gap: 10px;
            }

            .admin-nav-btn {
                padding: 10px 16px;
                font-size: 14px;
            }

            .settings-grid {
                grid-template-columns: 1fr;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .modal-content {
                padding: 20px;
                margin: 20px;
            }

            .modal-actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }

        /* 隱藏類別 */
        .hidden {
            display: none !important;
        }

        /* 成功/錯誤訊息 */
        .alert {
            padding: 16px;
            border-radius: var(--border-radius);
            margin-bottom: 20px;
        }

        .alert-success {
            background-color: #d1fae5;
            color: #059669;
            border: 1px solid #a7f3d0;
        }

        .alert-error {
            background-color: #fee2e2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }
    </style>
</head>
<body>
    <!-- 登入頁面 -->
    <div id="login-page" class="login-container">
        <div class="login-card">
            <h1 class="login-title">會議網站管理後台</h1>
            <div id="login-error" class="login-error hidden"></div>
            <form id="login-form">
                <div class="form-group">
                    <label class="form-label">帳號</label>
                    <input type="text" class="form-input" id="username" required>
                </div>
                <div class="form-group">
                    <label class="form-label">密碼</label>
                    <input type="password" class="form-input" id="password" required>
                </div>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-sign-in-alt"></i>
                    登入
                </button>
            </form>
        </div>
    </div>

    <!-- 管理介面 -->
    <div id="admin-page" class="hidden">
        <header class="admin-header">
            <div class="container">
                <div class="admin-header-content">
                    <h1 class="admin-title">會議網站管理後台</h1>
                    <div class="admin-user">
                        <i class="fas fa-user"></i>
                        <span id="admin-user-name">管理員</span>
                        <button class="btn btn-outline" id="logout-btn">登出</button>
                    </div>
                </div>
            </div>
        </header>

        <div class="container">
            <!-- 導航 -->
            <nav class="admin-nav">
                <button class="admin-nav-btn active" data-section="settings">
                    <i class="fas fa-cog"></i>
                    基本設定
                </button>
                <button class="admin-nav-btn" data-section="about">
                    <i class="fas fa-info-circle"></i>
                    會議介紹
                </button>
                <button class="admin-nav-btn" data-section="speakers">
                    <i class="fas fa-users"></i>
                    講師管理
                </button>
                <button class="admin-nav-btn" data-section="agenda">
                    <i class="fas fa-calendar"></i>
                    議程管理
                </button>
                <button class="admin-nav-btn" data-section="traffic">
                    <i class="fas fa-map-marker-alt"></i>
                    交通資訊
                </button>
                <button class="admin-nav-btn" data-section="privacy">
                    <i class="fas fa-shield-alt"></i>
                    個資宣告
                </button>
                <button class="admin-nav-btn" data-section="past-events">
                    <i class="fas fa-history"></i>
                    歷年會議
                </button>
            </nav>

            <!-- 載入中 -->
            <div id="loading-state" class="loading hidden">
                <div class="loading-spinner"></div>
                <p>載入中...</p>
            </div>

            <!-- 訊息區域 -->
            <div id="message-area"></div>

            <!-- 基本設定 -->
            <section id="settings-section" class="admin-section">
                <div class="card">
                    <h2 class="card-title">
                        <i class="fas fa-cog"></i>
                        基本設定
                    </h2>
                    <form id="settings-form">
                        <div class="settings-grid">
                            <div class="settings-group">
                                <h3 class="settings-group-title">網站狀態</h3>
                                <div class="form-group">
                                    <label class="form-label">網站狀態</label>
                                    <select class="form-select" id="site_status">
                                        <option value="draft">建置中</option>
                                        <option value="live">正常運作</option>
                                        <option value="closed">活動結束</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">報名狀態</label>
                                    <select class="form-select" id="registration_status">
                                        <option value="coming_soon">即將開放</option>
                                        <option value="open">開放報名</option>
                                        <option value="closed">報名截止</option>
                                    </select>
                                </div>
                            </div>

                            <div class="settings-group">
                                <h3 class="settings-group-title">會議資訊</h3>
                                <div class="form-group">
                                    <label class="form-label">會議名稱 (中文)</label>
                                    <input type="text" class="form-input" id="conference_title_zh">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">會議名稱 (英文)</label>
                                    <input type="text" class="form-input" id="conference_title_en">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">會議日期</label>
                                    <input type="text" class="form-input" id="conference_date" placeholder="YYYY-MM-DD">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">會議地點 (中文)</label>
                                    <input type="text" class="form-input" id="conference_location_zh">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">會議地點 (英文)</label>
                                    <input type="text" class="form-input" id="conference_location_en">
                                </div>
                            </div>

                            <div class="settings-group">
                                <h3 class="settings-group-title">報名設定</h3>
                                <div class="form-group">
                                    <label class="form-label">報名開始時間</label>
                                    <input type="datetime-local" class="form-input" id="registration_start_at">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">報名截止時間</label>
                                    <input type="datetime-local" class="form-input" id="registration_end_at">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">會議開始時間</label>
                                    <input type="datetime-local" class="form-input" id="event_start_at">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">會議結束時間</label>
                                    <input type="datetime-local" class="form-input" id="event_end_at">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Google Form 報名連結</label>
                                    <input type="url" class="form-input" id="registration_form_url">
                                </div>
                            </div>

                            <div class="settings-group">
                                <h3 class="settings-group-title">媒體設定</h3>
                                <div class="form-group">
                                    <label class="form-label">主視覺圖片 URL</label>
                                    <input type="url" class="form-input" id="hero_image_url">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Google Maps 嵌入碼</label>
                                    <input type="url" class="form-input" id="google_maps_embed">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">自訂網域名稱</label>
                                    <input type="text" class="form-input" id="custom_domain">
                                </div>
                            </div>

                            <div class="settings-group">
                                <h3 class="settings-group-title">訊息設定</h3>
                                <div class="form-group">
                                    <label class="form-label">建置中訊息 (中文)</label>
                                    <textarea class="form-textarea" id="maintenance_message_zh" rows="3"></textarea>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">建置中訊息 (英文)</label>
                                    <textarea class="form-textarea" id="maintenance_message_en" rows="3"></textarea>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">活動結束訊息 (中文)</label>
                                    <textarea class="form-textarea" id="closed_message_zh" rows="3"></textarea>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">活動結束訊息 (英文)</label>
                                    <textarea class="form-textarea" id="closed_message_en" rows="3"></textarea>
                                </div>
                            </div>
                        </div>

                        <div class="modal-actions">
                            <button type="submit" class="btn btn-success">
                                <i class="fas fa-save"></i>
                                儲存設定
                            </button>
                        </div>
                    </form>
                </div>
            </section>

            <!-- 會議介紹 -->
            <section id="about-section" class="admin-section hidden">
                <div class="card">
                    <h2 class="card-title">
                        <i class="fas fa-info-circle"></i>
                        會議介紹
                    </h2>
                    <button class="btn btn-success data-item-action add" id="add-about-btn">
                        <i class="fas fa-plus"></i>
                        新增介紹內容
                    </button>
                    <div id="about-list" class="data-list">
                        <!-- 動態載入內容 -->
                    </div>
                </div>
            </section>

            <!-- 講師管理 -->
            <section id="speakers-section" class="admin-section hidden">
                <div class="card">
                    <h2 class="card-title">
                        <i class="fas fa-users"></i>
                        講師管理
                    </h2>
                    <button class="btn btn-success data-item-action add" id="add-speaker-btn">
                        <i class="fas fa-plus"></i>
                        新增講師
                    </button>
                    <div id="speakers-list" class="data-list">
                        <!-- 動態載入內容 -->
                    </div>
                </div>
            </section>

            <!-- 議程管理 -->
            <section id="agenda-section" class="admin-section hidden">
                <div class="card">
                    <h2 class="card-title">
                        <i class="fas fa-calendar"></i>
                        議程管理
                    </h2>
                    <button class="btn btn-success data-item-action add" id="add-agenda-btn">
                        <i class="fas fa-plus"></i>
                        新增議程項目
                    </button>
                    <div id="agenda-list" class="data-list">
                        <!-- 動態載入內容 -->
                    </div>
                </div>
            </section>

            <!-- 交通資訊 -->
            <section id="traffic-section" class="admin-section hidden">
                <div class="card">
                    <h2 class="card-title">
                        <i class="fas fa-map-marker-alt"></i>
                        交通資訊
                    </h2>
                    <button class="btn btn-success data-item-action add" id="add-traffic-btn">
                        <i class="fas fa-plus"></i>
                        新增交通資訊
                    </button>

    <!-- Modal -->
    <div class="modal" id="edit-modal">
        <div class="modal-content">
            <button class="modal-close" id="edit-modal-close">&times;</button>

            <div class="modal-body">
                <form id="edit-form">
                    <!-- 動態表單內容 -->
                </form>
            </div>
            <div class="modal-actions">
                <button class="btn btn-outline" id="edit-cancel">取消</button>
                <button class="btn btn-success" id="edit-save">儲存</button>
            </div>
        </div>
    </div>

    <script>
        // 全域變數
        let currentUser = null;
        let currentSection = 'settings';
        let editData = null;
        let editType = null;

        // API 基礎 URL（請更換為您的 Apps Script Web App URL）
        const API_BASE_URL = 'https://script.google.com/macros/s/AKfycbyNFCi8b28YyFBwSYWyvmF8gRGliajTlYYKwXqkrSAX-ddbsqMS2WApnUvWwFdAru8YmQ/exec';
        const API_FALLBACK_URLS = [
            'https://script.google.com/macros/s/AKfycbwBcXiRx_0ylBkRqjrQ_96moYWDWuK9d8wClnOjeTosT9TOIBV7SWI72pBAFJtU0uF_fA/exec'
        ];
        let activeApiBaseUrl = API_BASE_URL;

        async function apiFetch(action, init = {}) {
            const candidates = [activeApiBaseUrl, ...API_FALLBACK_URLS.filter(url => url !== activeApiBaseUrl)];
            let lastError = null;

            for (const baseUrl of candidates) {
                const url = `${baseUrl}?action=${action}`;
                try {
                    const response = await fetch(url, init);
                    if (!response.ok) {
                        lastError = new Error(`API ${action} failed: ${response.status} ${response.statusText} @ ${baseUrl}`);
                        continue;
                    }

                    const data = await response.json();
                    if (data && data.success) {
                        if (baseUrl !== activeApiBaseUrl) {
                            activeApiBaseUrl = baseUrl;
                            console.warn(`已切換 API 端點至：${baseUrl}`);
                        }
                        return data;
                    }

                    lastError = new Error(data && data.error ? data.error : `API ${action} 回傳格式錯誤 @ ${baseUrl}`);
                } catch (error) {
                    lastError = error;
                }
            }

            throw lastError;
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            initLogin();
            initNavigation();
            initForms();
        });

        // 初始化登入
        function initLogin() {
            const loginForm = document.getElementById('login-form');

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;

                try {
                    const data = await apiFetch('adminLogin', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ username, password })
                    });

                    if (data.success) {
                        currentUser = data.user;
                        showAdminPage();
                        loadSettings();
                    } else {
                        showLoginError(data.error || '登入失敗');
                    }
                } catch (error) {
                    showLoginError('網路錯誤，請稍後再試');
                }
            });
        }

        // 顯示登入錯誤
        function showLoginError(message) {
            const errorEl = document.getElementById('login-error');
            errorEl.textContent = message;
            errorEl.classList.remove('hidden');
        }

        // 顯示管理頁面
        function showAdminPage() {
            document.getElementById('login-page').classList.add('hidden');
            document.getElementById('admin-page').classList.remove('hidden');
            document.getElementById('admin-user-name').textContent = currentUser.name;
        }

        // 初始化導航
        function initNavigation() {
            const navBtns = document.querySelectorAll('.admin-nav-btn');
            const logoutBtn = document.getElementById('logout-btn');

            navBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const section = btn.dataset.section;
                    switchSection(section);
                });
            });

            logoutBtn.addEventListener('click', () => {
                currentUser = null;
                document.getElementById('admin-page').classList.add('hidden');
                document.getElementById('login-page').classList.remove('hidden');
                document.getElementById('login-form').reset();
            });
        }

        // 切換區塊
        function switchSection(section) {
            currentSection = section;

            // 更新導航按鈕狀態
            document.querySelectorAll('.admin-nav-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.section === section);
            });

            // 隱藏所有區塊
            document.querySelectorAll('.admin-section').forEach(sec => {
                sec.classList.add('hidden');
            });

            // 顯示當前區塊
            document.getElementById(section + '-section').classList.remove('hidden');

            // 載入對應資料
            loadSectionData(section);
        }

        // 載入區塊資料
        async function loadSectionData(section) {
            showLoading(true);

            try {
                switch (section) {
                    case 'settings':
                        await loadSettings();
                        break;
                    case 'about':
                        await loadAbout();
                        break;
                    case 'speakers':
                        await loadSpeakers();
                        break;
                    case 'agenda':
                        await loadAgenda();
                        break;
                    case 'traffic':
                        await loadTraffic();
                        break;
                    case 'privacy':
                        await loadPrivacy();
                        break;
                    case 'past-events':
                        await loadPastEvents();
                        break;
                }
            } catch (error) {
                showMessage('載入資料失敗：' + error.message, 'error');
            } finally {
                showLoading(false);
            }
        }

        // 載入設定
        async function loadSettings() {
            try {
                const data = await apiFetch('getSettings');
                if (data.success) {
                    populateSettingsForm(data.data);
                }
            } catch (error) {
                console.error('載入設定失敗:', error);
            }
        }

        // 填充設定表單
        function populateSettingsForm(settings) {
            Object.keys(settings).forEach(key => {
                const el = document.getElementById(key);
                if (el) {
                    el.value = settings[key] || '';
                }
            });
        }

        // 載入會議介紹
        async function loadAbout() {
            try {
                const data = await apiFetch('getAbout');
                if (data.success) {
                    renderAboutList(data.data);
                }
            } catch (error) {
                console.error('載入會議介紹失敗:', error);
            }
        }

        // 渲染會議介紹列表
        function renderAboutList(about) {
            const container = document.getElementById('about-list');

            if (about.length === 0) {
                container.innerHTML = '<p>目前沒有會議介紹內容</p>';
                return;
            }

            container.innerHTML = about.map(item => `
                <div class="data-item">
                    <div class="data-item-header">
                        <div class="data-item-title">${item.title_zh}</div>
                        <div class="data-item-actions">
                            <button class="data-item-action edit" onclick="editAbout('${item.id}')">
                                <i class="fas fa-edit"></i> 編輯
                            </button>
                        </div>
                    </div>
                    <div class="data-item-content">
                        <p><strong>中文：</strong>${item.content_zh.substring(0, 100)}...</p>
                        <p><strong>英文：</strong>${item.content_en.substring(0, 100)}...</p>
                        <p><strong>圖片：</strong>${item.image_url || '無'}</p>
                        <p><strong>排序：</strong>${item.sort_order} | <strong>顯示：</strong>${item.is_visible ? '是' : '否'}</p>
                    </div>
                </div>
            `).join('');
        }

        // 載入講師
        async function loadSpeakers() {
            try {
                const data = await apiFetch('getSpeakers');
                if (data.success) {
                    renderSpeakersList(data.data);
                }
            } catch (error) {
                console.error('載入講師失敗:', error);
            }
        }

        // 渲染講師列表
        function renderSpeakersList(speakers) {
            const container = document.getElementById('speakers-list');

            if (speakers.length === 0) {
                container.innerHTML = '<p>目前沒有講師資料</p>';
                return;
            }

            container.innerHTML = speakers.map(speaker => `
                <div class="data-item">
                    <div class="data-item-header">
                        <div class="data-item-title">${speaker.name_zh} (${speaker.name_en})</div>
                        <div class="data-item-actions">
                            <button class="data-item-action edit" onclick="editSpeaker('${speaker.id}')">
                                <i class="fas fa-edit"></i> 編輯
                            </button>
                        </div>
                    </div>
                    <div class="data-item-content">
                        <p><strong>職稱：</strong>${speaker.title_zh} (${speaker.title_en})</p>
                        <p><strong>機構：</strong>${speaker.organization_zh} (${speaker.organization_en})</p>
                        <p><strong>排序：</strong>${speaker.sort_order} | <strong>顯示：</strong>${speaker.is_visible ? '是' : '否'}</p>
                    </div>
                </div>
            `).join('');
        }

        // 載入議程
        async function loadAgenda() {
            try {
                const data = await apiFetch('getAgenda');
                if (data.success) {
                    renderAgendaList(data.data);
                }
            } catch (error) {
                console.error('載入議程失敗:', error);
            }
        }

        // 渲染議程列表
        function renderAgendaList(agenda) {
            const container = document.getElementById('agenda-list');

            if (agenda.length === 0) {
                container.innerHTML = '<p>目前沒有議程資料</p>';
                return;
            }

            container.innerHTML = agenda.map(item => `
                <div class="data-item">
                    <div class="data-item-header">
                        <div class="data-item-title">${item.title_zh} (${item.title_en})</div>
                        <div class="data-item-actions">
                            <button class="data-item-action edit" onclick="editAgenda('${item.id}')">
                                <i class="fas fa-edit"></i> 編輯
                            </button>
                        </div>
                    </div>
                    <div class="data-item-content">
                        <p><strong>日期：</strong>${item.date} | <strong>時間：</strong>${item.start_time} - ${item.end_time}</p>
                        <p><strong>講師：</strong>${item.speaker_zh} (${item.speaker_en})</p>
                        <p><strong>地點：</strong>${item.location_zh} (${item.location_en})</p>
                        <p><strong>排序：</strong>${item.sort_order} | <strong>顯示：</strong>${item.is_visible ? '是' : '否'}</p>
                    </div>
                </div>
            `).join('');
        }

        // 載入交通資訊
        async function loadTraffic() {
            try {
                const data = await apiFetch('getTraffic');
                if (data.success) {
                    renderTrafficList(data.data);
                }
            } catch (error) {
                console.error('載入交通資訊失敗:', error);
            }
        }

        // 渲染交通資訊列表
        function renderTrafficList(traffic) {
            const container = document.getElementById('traffic-list');

            if (traffic.length === 0) {
                container.innerHTML = '<p>目前沒有交通資訊</p>';
                return;
            }

            container.innerHTML = traffic.map(item => `
                <div class="data-item">
                    <div class="data-item-header">
                        <div class="data-item-title">${item.title_zh} (${item.title_en})</div>
                        <div class="data-item-actions">
                            <button class="data-item-action edit" onclick="editTraffic('${item.id}')">
                                <i class="fas fa-edit"></i> 編輯
                            </button>
                        </div>
                    </div>
                    <div class="data-item-content">
                        <p><strong>類型：</strong>${item.type}</p>
                        <p><strong>排序：</strong>${item.sort_order} | <strong>顯示：</strong>${item.is_visible ? '是' : '否'}</p>
                    </div>
                </div>
            `).join('');
        }

        // 載入個資宣告
        async function loadPrivacy() {
            try {
                const data = await apiFetch('getPrivacy');

                if (data.success && data.data) {
                    populatePrivacyForm(data.data);
                }
            } catch (error) {
                console.error('載入個資宣告失敗:', error);
            }
        }

        // 填充個資宣告表單
        function populatePrivacyForm(privacy) {
            document.getElementById('privacy_title_zh').value = privacy.title_zh || '';
            document.getElementById('privacy_title_en').value = privacy.title_en || '';
            document.getElementById('privacy_content_zh').value = privacy.content_zh || '';
            document.getElementById('privacy_content_en').value = privacy.content_en || '';
            document.getElementById('privacy_checkbox_text_zh').value = privacy.checkbox_text_zh || '';
            document.getElementById('privacy_checkbox_text_en').value = privacy.checkbox_text_en || '';
        }

        // 載入歷年會議
        async function loadPastEvents() {
            try {
                const data = await apiFetch('getPastEvents');

                if (data.success) {
                    renderPastEventsList(data.data);
                }
            } catch (error) {
                console.error('載入歷年會議失敗:', error);
            }
        }

        // 渲染歷年會議列表
        function renderPastEventsList(events) {
            const container = document.getElementById('past-events-list');

            if (events.length === 0) {
                container.innerHTML = '<p>目前沒有歷年會議資料</p>';
                return;
            }

            container.innerHTML = events.map(event => `
                <div class="data-item">
                    <div class="data-item-header">
                        <div class="data-item-title">${event.year} - ${event.title_zh} (${event.title_en})</div>
                        <div class="data-item-actions">
                            <button class="data-item-action edit" onclick="editPastEvent('${event.id}')">
                                <i class="fas fa-edit"></i> 編輯
                            </button>
                        </div>
                    </div>
                    <div class="data-item-content">
                        <p><strong>相簿連結：</strong>${event.album_url || '無'}</p>
                        <p><strong>特色圖片：</strong>${event.featured_image_url || '無'}</p>
                        <p><strong>排序：</strong>${event.sort_order} | <strong>顯示：</strong>${event.is_visible ? '是' : '否'}</p>
                    </div>
                </div>
            `).join('');
        }

        // 初始化表單
        function initForms() {
            // 設定表單
            document.getElementById('settings-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                await saveSettings();
            });

            // 個資宣告表單
            document.getElementById('privacy-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                await savePrivacy();
            });

            // 新增按鈕事件
            document.getElementById('add-about-btn').addEventListener('click', () => showEditModal('about', null));
            document.getElementById('add-speaker-btn').addEventListener('click', () => showEditModal('speakers', null));
            document.getElementById('add-agenda-btn').addEventListener('click', () => showEditModal('agenda', null));
            document.getElementById('add-traffic-btn').addEventListener('click', () => showEditModal('traffic', null));
            document.getElementById('add-past-event-btn').addEventListener('click', () => showEditModal('past-events', null));

            // Modal 事件
            document.getElementById('edit-modal-close').addEventListener('click', () => hideEditModal());
            document.getElementById('edit-cancel').addEventListener('click', () => hideEditModal());
            document.getElementById('edit-save').addEventListener('click', () => saveEditData());

            // 點擊 Modal 背景關閉
            document.getElementById('edit-modal').addEventListener('click', (e) => {
                if (e.target === e.currentTarget) {
                    hideEditModal();
                }
            });
        }

        // 儲存設定
        async function saveSettings() {
            const formData = new FormData(document.getElementById('settings-form'));
            const settings = {};

            for (let [key, value] of formData.entries()) {
                settings[key] = value;
            }

            try {
                const data = await apiFetch('saveSettings', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ settings })
                });

                if (data.success) {
                    showMessage('設定已儲存', 'success');
                } else {
                    showMessage('儲存失敗：' + data.error, 'error');
                }
            } catch (error) {
                showMessage('網路錯誤，請稍後再試', 'error');
            }
        }

        // 儲存個資宣告
        async function savePrivacy() {
            const privacy = {
                id: '1',
                title_zh: document.getElementById('privacy_title_zh').value,
                title_en: document.getElementById('privacy_title_en').value,
                content_zh: document.getElementById('privacy_content_zh').value,
                content_en: document.getElementById('privacy_content_en').value,
                checkbox_text_zh: document.getElementById('privacy_checkbox_text_zh').value,
                checkbox_text_en: document.getElementById('privacy_checkbox_text_en').value
            };

            try {
                const data = await apiFetch('savePrivacy', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ privacy })
                });

                if (data.success) {
                    showMessage('個資宣告已儲存', 'success');
                } else {
                    showMessage('儲存失敗：' + data.error, 'error');
                }
            } catch (error) {
                showMessage('網路錯誤，請稍後再試', 'error');
            }
        }

        // 編輯函數
        function editAbout(id) { showEditModal('about', id); }
        function editSpeaker(id) { showEditModal('speakers', id); }
        function editAgenda(id) { showEditModal('agenda', id); }
        function editTraffic(id) { showEditModal('traffic', id); }
        function editPastEvent(id) { showEditModal('past-events', id); }

        // 顯示編輯 Modal
        async function showEditModal(type, id) {
            editType = type;
            editData = null;

            const modal = document.getElementById('edit-modal');
            const title = document.getElementById('edit-modal-title');
            const form = document.getElementById('edit-form');

            // 設定標題
            const titles = {
                about: '會議介紹',
                speakers: '講師',
                agenda: '議程項目',
                traffic: '交通資訊',
                'past-events': '歷年會議'
            };
            title.textContent = (id ? '編輯' : '新增') + titles[type];

            // 載入現有資料
            if (id) {
                try {
                    const data = await apiFetch(`get${type.charAt(0).toUpperCase() + type.slice(1)}`);

                    if (data.success) {
                        editData = data.data.find(item => item.id === id);
                    }
                } catch (error) {
                    console.error('載入資料失敗:', error);
                }
            }

            // 生成表單
            form.innerHTML = generateForm(type, editData);

            modal.classList.add('show');
        }

        // 隱藏編輯 Modal
        function hideEditModal() {
            document.getElementById('edit-modal').classList.remove('show');
            editData = null;
            editType = null;
        }

        // 生成表單
        function generateForm(type, data) {
            const isEdit = !!data;

            switch (type) {
                case 'about':
                    return `
                        <input type="hidden" name="id" value="${data?.id || generateId()}">
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">標題 (中文)</label>
                                <input type="text" class="form-input" name="title_zh" value="${data?.title_zh || ''}" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">標題 (英文)</label>
                                <input type="text" class="form-input" name="title_en" value="${data?.title_en || ''}" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group form-full">
                                <label class="form-label">內容 (中文)</label>
                                <textarea class="form-textarea" name="content_zh" rows="6" required>${data?.content_zh || ''}</textarea>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group form-full">
                                <label class="form-label">內容 (英文)</label>
                                <textarea class="form-textarea" name="content_en" rows="6" required>${data?.content_en || ''}</textarea>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">圖片 URL</label>
                                <input type="url" class="form-input" name="image_url" value="${data?.image_url || ''}">
                            </div>
                            <div class="form-group">
                                <label class="form-label">排序</label>
                                <input type="number" class="form-input" name="sort_order" value="${data?.sort_order || 1}" required>
                            </div>

        // 儲存編輯資料
        async function saveEditData() {
            const form = document.getElementById('edit-form');
            const formData = new FormData(form);
            const data = {};

            for (let [key, value] of formData.entries()) {
                if (key === 'is_visible') {
                    data[key] = form.querySelector(`[name="${key}"]`).checked ? 'true' : 'false';
                } else {
                    data[key] = value;
                }
            }

            try {
                let action;
                let payload;

                switch (editType) {
                    case 'about':
                        action = 'saveAbout';
                        payload = { about: [data] };
                        break;
                    case 'speakers':
                        action = 'saveSpeakers';
                        payload = { speakers: [data] };
                        break;
                    case 'agenda':
                        action = 'saveAgenda';
                        payload = { agenda: [data] };
                        break;
                    case 'traffic':
                        action = 'saveTraffic';
                        payload = { traffic: [data] };
                        break;
                    case 'past-events':
                        action = 'savePastEvents';
                        payload = { pastEvents: [data] };
                        break;
                }

                const result = await apiFetch(action, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload)
                });

                if (result.success) {
                    showMessage('資料已儲存', 'success');
                    hideEditModal();
                    loadSectionData(currentSection);
                } else {
                    showMessage('儲存失敗：' + result.error, 'error');
                }
            } catch (error) {
                showMessage('網路錯誤，請稍後再試', 'error');
            }
        }

        // 工具函數
        function showLoading(show) {
            const loading = document.getElementById('loading-state');
            if (show) {
                loading.classList.remove('hidden');
            } else {
                loading.classList.add('hidden');
            }
        }

        function showMessage(message, type) {
            const area = document.getElementById('message-area');
            area.innerHTML = `<div class="alert alert-${type}">${message}</div>`;

            // 自動清除訊息
            setTimeout(() => {
                area.innerHTML = '';
            }, 5000);
        }

        function generateId() {
            return Date.now().toString() + Math.random().toString(36).substr(2, 9);
        }
