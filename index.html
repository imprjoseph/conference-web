<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會議活動官方網站</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* CSS 樣式 */
        :root {
            --primary-color: #1e40af;
            --primary-light: #3b82f6;
            --primary-dark: #1e3a8a;
            --secondary-color: #64748b;
            --accent-color: #f59e0b;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --text-color: #1f2937;
            --text-light: #6b7280;
            --bg-color: #ffffff;
            --bg-light: #f8fafc;
            --bg-gray: #f1f5f9;
            --border-color: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --border-radius: 8px;
            --border-radius-lg: 12px;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--bg-color);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* 載入動畫 */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 200px;
            flex-direction: column;
            gap: 20px;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border-color);
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 導航欄 */
        .navbar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 0;
        }

        .navbar-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .navbar-brand {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary-color);
            text-decoration: none;
        }

        .navbar-menu {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .navbar-link {
            color: var(--text-color);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
            padding: 8px 16px;
            border-radius: var(--border-radius);
        }

        .navbar-link:hover,
        .navbar-link.active {
            color: var(--primary-color);
            background-color: var(--bg-light);
        }

        .language-switch {
            display: flex;
            gap: 5px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            overflow: hidden;
        }

        .lang-btn {
            padding: 6px 12px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 14px;
            transition: var(--transition);
        }

        .lang-btn.active {
            background-color: var(--primary-color);
            color: white;
        }

        .mobile-menu-toggle {
            display: none;
            flex-direction: column;
            cursor: pointer;
            gap: 4px;
        }

        .mobile-menu-toggle span {
            width: 25px;
            height: 3px;
            background-color: var(--text-color);
            transition: var(--transition);
        }

        /* Hero 區塊 */
        .hero {
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary-color) 100%);
            color: white;
            padding: 120px 20px 80px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="25" cy="25" r="1" fill="rgba(255,255,255,0.1)"/><circle cx="75" cy="75" r="1" fill="rgba(255,255,255,0.05)"/><circle cx="50" cy="10" r="0.5" fill="rgba(255,255,255,0.08)"/></pattern></defs><rect width="100" height="100" fill="url(%23grain)"/></svg>');
            opacity: 0.1;
        }

        .hero-content {
            position: relative;
            z-index: 1;
            max-width: 800px;
            margin: 0 auto;
        }

        .hero-image {
            width: 100%;
            max-width: 600px;
            height: 300px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: var(--border-radius-lg);
            margin: 0 auto 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            backdrop-filter: blur(10px);
        }

        .hero-title {
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 16px;
            line-height: 1.2;
        }

        .hero-subtitle {
            font-size: 24px;
            font-weight: 400;
            margin-bottom: 32px;
            opacity: 0.9;
        }

        .hero-meta {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .hero-meta-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .hero-meta-label {
            font-size: 14px;
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .hero-meta-value {
            font-size: 18px;
            font-weight: 600;
        }

        .hero-actions {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 16px 32px;
            border-radius: var(--border-radius);
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: var(--transition);
            border: none;
            cursor: pointer;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: #d97706;
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .btn-outline {
            background-color: transparent;
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .btn-outline:hover {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.5);
        }

        /* 倒數計時 */
        .countdown {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: var(--border-radius-lg);
            padding: 30px;
            margin: 40px auto 0;
            max-width: 600px;
        }

        .countdown-title {
            font-size: 18px;
            margin-bottom: 20px;
            opacity: 0.9;
        }

        .countdown-timer {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .countdown-item {
            text-align: center;
            min-width: 80px;
        }

        .countdown-number {
            font-size: 36px;
            font-weight: 800;
            display: block;
            line-height: 1;
        }

        .countdown-label {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* 區塊標題 */
        .section {
            padding: 80px 0;
        }

        .section-title {
            text-align: center;
            margin-bottom: 60px;
        }

        .section-title h2 {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text-color);
        }

        .section-title p {
            font-size: 18px;
            color: var(--text-light);
            max-width: 600px;
            margin: 0 auto;
        }

        /* 關於會議 */
        .about-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
        }

        .about-card {
            background: var(--bg-color);
            border-radius: var(--border-radius-lg);
            padding: 40px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .about-card h3 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text-color);
        }

        .about-card p {
            color: var(--text-light);
            line-height: 1.7;
            margin-bottom: 20px;
        }

        .about-card img {
            width: 100%;
            border-radius: var(--border-radius);
            margin-top: 20px;
        }

        /* 講師區塊 */
        /* speaker-card styles moved to upgraded block below */

        /* ── 講師卡片：圓形大頭照 + 簡介兩層設計 ── */
        .speakers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 32px;
        }

        .speaker-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.08);
            border: 1px solid var(--border-color);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 32px 24px 24px;
            text-align: center;
        }

        .speaker-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 32px rgba(30,64,175,0.13);
        }

        /* 圓形大頭照 */
        .speaker-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            overflow: hidden;
            background: var(--bg-gray);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: var(--text-light);
            margin-bottom: 20px;
            border: 4px solid #e0e7ff;
            flex-shrink: 0;
        }

        .speaker-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .speaker-content {
            width: 100%;
        }

        .speaker-name {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text-color);
        }

        .speaker-title {
            font-size: 14px;
            color: var(--primary-color);
            font-weight: 500;
            margin-bottom: 4px;
        }

        .speaker-org {
            font-size: 13px;
            color: var(--text-light);
            margin-bottom: 14px;
        }

        .speaker-bio {
            font-size: 13px;
            color: #6b7280;
            line-height: 1.65;
            margin-bottom: 20px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-align: left;
        }

        .speaker-detail-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--primary-color);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 9px 20px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            text-decoration: none;
        }

        .speaker-detail-btn:hover {
            background: var(--primary-dark);
            color: #fff;
        }

        /* 講師詳細 Modal 升級 */
        .speaker-modal .modal-content {
            max-width: 700px;
        }

        .speaker-detail {
            display: flex;
            gap: 32px;
            align-items: flex-start;
        }

        .speaker-detail-avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            overflow: hidden;
            background: var(--bg-gray);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 56px;
            color: var(--text-light);
            flex-shrink: 0;
            border: 4px solid #e0e7ff;
        }

        .speaker-detail-avatar img {
            width: 100%; height: 100%; object-fit: cover;
        }

        .speaker-detail-body {
            flex: 1;
        }

        .speaker-detail-body h3 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .speaker-detail-body .tag-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }

        .speaker-tag {
            background: #eff6ff;
            color: var(--primary-color);
            border-radius: 20px;
            padding: 3px 12px;
            font-size: 13px;
            font-weight: 500;
        }

        .speaker-section-label {
            font-size: 13px;
            font-weight: 700;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 16px 0 6px;
            border-left: 3px solid var(--primary-color);
            padding-left: 8px;
        }

        .speaker-detail-body p {
            font-size: 14px;
            color: #374151;
            line-height: 1.75;
        }

        @media (max-width: 600px) {
            .speaker-detail { flex-direction: column; align-items: center; text-align: center; }
            .speaker-detail-body .tag-row { justify-content: center; }
        }

        /* 議程區塊 */
        .agenda-container {
            background: var(--bg-light);
            border-radius: var(--border-radius-lg);
            padding: 40px;
            margin-top: 40px;
        }

        .agenda-item {
            display: flex;
            gap: 30px;
            padding: 30px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .agenda-item:last-child {
            border-bottom: none;
        }

        .agenda-time {
            min-width: 120px;
            font-weight: 600;
            color: var(--primary-color);
            font-size: 16px;
        }

        .agenda-content {
            flex: 1;
        }

        .agenda-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-color);
        }

        .agenda-speaker {
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 4px;
        }

        .agenda-location {
            font-size: 14px;
            color: var(--text-light);
        }

        .agenda-notes {
            font-size: 14px;
            color: var(--text-light);
            font-style: italic;
            margin-top: 8px;
        }

        /* 交通資訊 */
        /* ── 交通資訊：Google Maps 整合版 ── */
        .traffic-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 32px;
            align-items: start;
        }

        @media (max-width: 768px) {
            .traffic-layout { grid-template-columns: 1fr; }
        }

        .traffic-map-container {
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow-lg);
            background: var(--bg-gray);
            min-height: 380px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .traffic-map-container iframe {
            width: 100%;
            height: 380px;
            border: 0;
            display: block;
        }

        .traffic-map-placeholder {
            text-align: center;
            color: var(--text-light);
            padding: 40px;
        }

        .traffic-map-placeholder i {
            font-size: 48px;
            color: var(--primary-light);
            margin-bottom: 12px;
            display: block;
        }

        .traffic-info-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .traffic-card {
            background: var(--bg-color);
            border-radius: 12px;
            padding: 20px 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            display: flex;
            gap: 16px;
            align-items: flex-start;
        }

        .traffic-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: #eff6ff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 18px;
            color: var(--primary-color);
        }

        .traffic-card-body h3 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-color);
        }

        .traffic-card-body p {
            color: var(--text-light);
            line-height: 1.65;
            font-size: 14px;
            white-space: pre-line;
        }

        .traffic-open-map-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 10px;
            background: var(--primary-color);
            color: #fff;
            border-radius: 8px;
            padding: 7px 16px;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            transition: background 0.2s;
        }

        .traffic-open-map-btn:hover { background: var(--primary-dark); color: #fff; }

        /* 歷年會議 */
        .past-events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .past-event-card {
            background: var(--bg-color);
            border-radius: var(--border-radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            transition: var(--transition);
        }

        .past-event-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
        }

        .past-event-image {
            width: 100%;
            height: 200px;
            background: var(--bg-gray);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: var(--text-light);
        }

        .past-event-content {
            padding: 24px;
        }

        .past-event-year {
            font-size: 14px;
            color: var(--primary-color);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .past-event-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-color);
        }

        .past-event-desc {
            font-size: 14px;
            color: var(--text-light);
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .past-event-link {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
        }

        .past-event-link:hover {
            text-decoration: underline;
        }

        /* 浮動報名按鈕 */
        /* ── 浮動報名按鈕：大尺寸 + GIF + 文字 ── */
        .floating-register {
            position: fixed;
            bottom: 32px;
            right: 32px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .floating-btn {
            width: auto;
            min-width: 130px;
            height: auto;
            padding: 0;
            border-radius: 50px;
            background: var(--accent-color);
            color: white;
            border: none;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(245,158,11,0.45);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .floating-btn:hover {
            transform: scale(1.06) translateY(-3px);
            box-shadow: 0 12px 32px rgba(245,158,11,0.55);
        }

        /* GIF 圖示區 */
        .floating-btn-gif {
            width: 80px;
            height: 80px;
            object-fit: cover;
            display: block;
            border-radius: 50px 50px 0 0;
        }

        /* 無 GIF 時的預設圖示 */
        .floating-btn-icon {
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            background: var(--accent-color);
        }

        /* 文字標籤 */
        .floating-btn-label {
            background: var(--accent-color);
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            padding: 8px 20px;
            width: 100%;
            text-align: center;
            white-space: nowrap;
        }

        /* 脈衝動畫 */
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(245,158,11,0.5); }
            70% { box-shadow: 0 0 0 16px rgba(245,158,11,0); }
            100% { box-shadow: 0 0 0 0 rgba(245,158,11,0); }
        }

        .floating-btn.pulse {
            animation: pulse-ring 2s ease-out infinite;
        }

        @media (max-width: 768px) {
            .floating-register { bottom: 20px; right: 16px; }
            .floating-btn { min-width: 110px; }
            .floating-btn-gif,
            .floating-btn-icon { width: 64px; height: 64px; font-size: 26px; }
            .floating-btn-label { font-size: 12px; padding: 6px 14px; }
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: var(--bg-color);
            border-radius: var(--border-radius-lg);
            padding: 40px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-light);
        }

        .modal-title {

    <!-- 講師詳細資訊 Modal -->

        <div class="modal-content">

                <!-- 動態載入內容 -->
            </div>

    <script>
        // 全域變數
        let currentLang = localStorage.getItem('conference-lang') || 'zh';
        let siteData = {};
        let countdownInterval;

        // ── API URL 管理：優先讀 localStorage（後台設定），再用預設值 ──
        // 若後台「系統設定」更新了 API URL，前台自動使用新 URL
        const API_DEFAULT_URL = 'https://script.google.com/macros/s/AKfycbwzAaIa9_lktbXQgFa353mKy2Mr0DM10bjmHbdS_nTpqNPqeFSHJE4CJWSPeUizSe_qpA/exec';

        function getApiUrl() {
            return localStorage.getItem('GAS_API_URL') || API_DEFAULT_URL;
        }

        let activeApiBaseUrl = getApiUrl();

        async function apiFetch(action, init = {}) {
            const url = `${activeApiBaseUrl}?action=${action}`;
            const response = await fetch(url, init);
            if (!response.ok) {
                throw new Error(`API ${action} 失敗: ${response.status} ${response.statusText}`);
            }
            const data = await response.json();
            if (data && data.success !== undefined) return data;
            throw new Error(data && data.error ? data.error : `API ${action} 回傳格式錯誤`);
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            initLanguage();
            initMobileMenu();
            loadSiteData();
        });

        // 載入網站資料
        async function loadSiteData() {
            try {
                showLoading(true);

                // 載入設定
                const settingsData = await apiFetch('getSettings');
                siteData.settings = settingsData.data;

                // 檢查網站狀態
                checkSiteStatus();

                // 如果網站正常運作，載入其他資料
                if (siteData.settings.site_status === 'live') {
                    await loadAllData();
                }

            } catch (error) {
                console.error('載入資料失敗:', error);
                showError('載入資料失敗，請稍後再試');
            } finally {
                showLoading(false);
            }
        }

        // 檢查網站狀態
        function checkSiteStatus() {
            const status = siteData.settings.site_status;

            if (status === 'draft') {
                showDraftPage();
            } else if (status === 'closed') {
                showClosedPage();
            } else if (status === 'live') {
                showLiveContent();
            }
        }

        // 顯示建置中頁面
        function showDraftPage() {
            document.getElementById('loading-state').classList.add('hidden');
            document.getElementById('draft-state').classList.remove('hidden');

            const titleEl = document.getElementById('draft-title');
            const messageEl = document.getElementById('draft-message');

            titleEl.textContent = currentLang === 'zh' ?
                siteData.settings.maintenance_message_zh || '網站建置中' :
                siteData.settings.maintenance_message_en || 'Website under construction';

            messageEl.textContent = currentLang === 'zh' ?
                siteData.settings.maintenance_message_zh || '網站正在建置中，請稍後再訪。' :
                siteData.settings.maintenance_message_en || 'Website under construction, please visit later.';
        }

        // 顯示活動結束頁面
        function showClosedPage() {
            document.getElementById('loading-state').classList.add('hidden');
            document.getElementById('closed-state').classList.remove('hidden');

            const titleEl = document.getElementById('closed-title');
            const messageEl = document.getElementById('closed-message');

            titleEl.textContent = currentLang === 'zh' ?
                siteData.settings.closed_message_zh || '活動已圓滿結束' :
                siteData.settings.closed_message_en || 'Event has ended successfully';

            messageEl.textContent = currentLang === 'zh' ?
                siteData.settings.closed_message_zh || '感謝您的參與，歡迎關注我們下次的活動。' :
                siteData.settings.closed_message_en || 'Thank you for your participation, welcome to follow our next event.';
        }

        // 顯示正常內容
        function showLiveContent() {
            document.getElementById('loading-state').classList.add('hidden');
            document.getElementById('hero-section').classList.remove('hidden');
            document.getElementById('about-section').classList.remove('hidden');
            document.getElementById('speakers-section').classList.remove('hidden');
            document.getElementById('agenda-section').classList.remove('hidden');
            document.getElementById('traffic-section').classList.remove('hidden');
            document.getElementById('past-events-section').classList.remove('hidden');
            // floating visibility now controlled by updateRegisterButton()
        }

        // 載入所有資料
        async function loadAllData() {
            const promises = [
                loadAbout(),
                loadSpeakers(),
                loadAgenda(),
                loadTraffic(),
                loadPrivacy(),
                loadPastEvents()
            ];

            await Promise.all(promises);

            // 資料全部載入後，套用當前語言重新 render 全部內容
            // 這樣不論語言是中文還是英文，都保證顯示正確版本
            updateContent();
            initRegisterButtons();
        }

        // 更新 Hero 區塊
        function updateHero() {
            const settings = siteData.settings;

            document.getElementById('site-title').textContent = currentLang === 'zh' ?
                settings.conference_title_zh || '會議活動' :
                settings.conference_title_en || 'Conference';

            document.getElementById('hero-title').textContent = currentLang === 'zh' ?
                settings.conference_title_zh || '會議名稱' :
                settings.conference_title_en || 'Conference Title';

            document.getElementById('hero-subtitle').textContent = currentLang === 'zh' ?
                settings.conference_subtitle_zh || '會議副標題' :
                settings.conference_subtitle_en || 'Conference Subtitle';

            document.getElementById('hero-date').textContent = settings.conference_date || '-';
            document.getElementById('hero-location').textContent = currentLang === 'zh' ?
                settings.conference_location_zh || '-' :
                settings.conference_location_en || '-';

            // 更新報名按鈕狀態
            updateRegisterButton();
        }

        // 更新報名按鈕狀態
        function updateRegisterButton() {
            const settings = siteData.settings || {};
            const status = settings.registration_status;
            const btn = document.getElementById('register-btn');
            const btnText = document.getElementById('register-btn-text');
            const floatingWrap = document.getElementById('floating-register');
            const floatingLabel = document.getElementById('floating-btn-label');
            const floatingIcon = document.getElementById('floating-btn-icon');

            // ── GIF 圖示：若後台有設定 floating_btn_gif_url 就顯示 GIF ──
            const gifUrl = settings.floating_btn_gif_url || '';
            if (gifUrl && floatingIcon) {
                floatingIcon.innerHTML = `<img src="${gifUrl}" class="floating-btn-gif" alt="報名">`;
            }

            // ── 時間判斷：若報名截止時間已過，強制隱藏 ──
            const now = new Date();
            const regEnd = settings.registration_end_at ? new Date(settings.registration_end_at) : null;
            const isExpired = regEnd && now > regEnd;

            // ── 更新文字 ──
            const lang = currentLang;
            if (floatingLabel) {
                floatingLabel.textContent = lang === 'zh' ? '立即報名' : 'Register Now';
            }

            if (status === 'coming_soon') {
                btnText.textContent = lang === 'zh' ? '報名尚未開放' : 'Registration Coming Soon';
                btn.disabled = true;
                btn.style.opacity = '0.6';
                floatingWrap.classList.add('hidden');
            } else if (status === 'open' && !isExpired) {
                btnText.textContent = lang === 'zh' ? '立即報名' : 'Register Now';
                btn.disabled = false;
                btn.style.opacity = '1';
                floatingWrap.classList.remove('hidden');
            } else {
                // closed 或時間已過
                btnText.textContent = lang === 'zh' ? '報名已截止' : 'Registration Closed';
                btn.disabled = true;
                btn.style.opacity = '0.6';
                floatingWrap.classList.add('hidden');
            }

            // ── 若報名中，每分鐘重新檢查是否到期 ──
            if (status === 'open' && regEnd && !isExpired) {
                const msLeft = regEnd - now;
                setTimeout(updateRegisterButton, Math.min(msLeft + 1000, 60000));
            }
        }

        // 更新倒數計時
        function updateCountdown() {
            const settings = siteData.settings;
            const now = new Date();
            let targetDate;
            let titleText;

            const registrationEnd = settings.registration_end_at ? new Date(settings.registration_end_at) : null;
            const eventStart = settings.event_start_at ? new Date(settings.event_start_at) : null;
            const eventEnd = settings.event_end_at ? new Date(settings.event_end_at) : null;

            if (now < (registrationEnd || new Date())) {
                // 報名期間
                targetDate = registrationEnd;
                titleText = currentLang === 'zh' ? '距離報名截止還有' : 'Registration closes in';
            } else if (now < (eventStart || new Date())) {
                // 報名結束後到活動開始前
                targetDate = eventStart;
                titleText = currentLang === 'zh' ? '距離會議開始還有' : 'Event starts in';
            } else if (now < (eventEnd || new Date())) {
                // 活動進行中
                document.getElementById('countdown-title').textContent = currentLang === 'zh' ? '會議進行中' : 'Event in progress';
                document.getElementById('countdown-timer').innerHTML = '<div style="font-size: 24px; color: var(--success-color);">🎉</div>';
                return;
            } else {
                // 活動結束
                document.getElementById('countdown-title').textContent = currentLang === 'zh' ? '會議已圓滿結束' : 'Event has ended successfully';
                document.getElementById('countdown-timer').innerHTML = '<div style="font-size: 24px; color: var(--success-color);">✅</div>';
                return;
            }

            if (!targetDate) {
                document.getElementById('countdown-section').style.display = 'none';
                return;
            }

            document.getElementById('countdown-title').textContent = titleText;

            // 清除舊的計時器
            if (countdownInterval) {
                clearInterval(countdownInterval);
            }

            // 開始倒數
            countdownInterval = setInterval(() => {
                const now = new Date();
                const diff = targetDate - now;

                if (diff <= 0) {
                    updateCountdown();
                    return;
                }

                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));

                document.getElementById('days').textContent = days.toString().padStart(2, '0');
                document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
                document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
            }, 1000);
        }

        // 載入會議介紹
        async function loadAbout() {
            try {
                const data = await apiFetch('getAbout');
            siteData.about = data.data;
            renderAbout();
            } catch (error) {
                console.error('載入會議介紹失敗:', error);
            }
        }

        // 渲染會議介紹
        function renderAbout() {
            const container = document.getElementById('about-content');
            const about = siteData.about || [];
            const lang = currentLang;

            if (about.length === 0) {
                container.innerHTML = `<div class="loading-section">${lang === 'zh' ? '目前沒有會議介紹內容' : 'No content available'}</div>`;
                return;
            }

            container.innerHTML = about.map(item => `
                <div class="about-card">
                    <h3>${lang === 'zh' ? item.title_zh : item.title_en}</h3>
                    <p>${lang === 'zh' ? item.content_zh : item.content_en}</p>
                    ${item.image_url ? `<img src="${item.image_url}" alt="${lang === 'zh' ? item.title_zh : item.title_en}">` : ''}
                </div>
            `).join('');
        }

        // 載入講師資料
        async function loadSpeakers() {
            try {
                const data = await apiFetch('getSpeakers');
            siteData.speakers = data.data;
            renderSpeakers();
            } catch (error) {
                console.error('載入講師資料失敗:', error);
            }
        }

        // 渲染講師（第一層：圓形大頭照 + 簡介卡片）
        function renderSpeakers() {
            const container = document.getElementById('speakers-content');
            const speakers = siteData.speakers || [];

            if (speakers.length === 0) {
                container.innerHTML = '<div class="loading-section">目前沒有講師資料</div>';
                return;
            }

            const lang = currentLang;
            container.innerHTML = speakers.map(sp => {
                const name = lang === 'zh' ? sp.name_zh : sp.name_en;
                const title = lang === 'zh' ? sp.title_zh : sp.title_en;
                const org = lang === 'zh' ? sp.organization_zh : sp.organization_en;
                const bio = lang === 'zh' ? sp.short_bio_zh : sp.short_bio_en;
                const photoHtml = sp.photo_url
                    ? `<img src="${sp.photo_url}" alt="${name}">`
                    : '<i class="fas fa-user"></i>';
                return `
                <div class="speaker-card">
                    <div class="speaker-avatar">${photoHtml}</div>
                    <div class="speaker-content">
                        <div class="speaker-name">${name}</div>
                        <div class="speaker-title">${title}</div>
                        <div class="speaker-org">${org}</div>
                        <div class="speaker-bio">${bio}</div>
                        <button class="speaker-detail-btn" onclick="showSpeakerDetail('${sp.id}')">
                            <i class="fas fa-address-card"></i>
                            ${lang === 'zh' ? '查看詳細' : 'View Profile'}
                        </button>
                    </div>
                </div>`;
            }).join('');
        }

        // 載入議程
        async function loadAgenda() {
            try {
                const data = await apiFetch('getAgenda');
            siteData.agenda = data.data;
            renderAgenda();
            } catch (error) {
                console.error('載入議程失敗:', error);
            }
        }

        // 渲染議程
        function renderAgenda() {
            const container = document.getElementById('agenda-content');
            const agenda = siteData.agenda || [];
            const lang = currentLang;

            if (agenda.length === 0) {
                container.innerHTML = '<div class="loading-section">目前沒有議程資料</div>';
                return;
            }

            // 按日期和時間排序
            agenda.sort((a, b) => {
                const dateA = new Date(a.date + ' ' + a.start_time);
                const dateB = new Date(b.date + ' ' + b.start_time);
                return dateA - dateB;
            });

            container.innerHTML = agenda.map(item => `
                <div class="agenda-item">
                    <div class="agenda-time">
                        ${item.start_time} - ${item.end_time}<br>
                        <small>${formatDate(item.date)}</small>
                    </div>
                    <div class="agenda-content">
                        <div class="agenda-title">${lang === 'zh' ? item.title_zh : item.title_en}</div>
                        <div class="agenda-speaker">${lang === 'zh' ? item.speaker_zh : item.speaker_en}</div>
                        <div class="agenda-location">${lang === 'zh' ? item.location_zh : item.location_en}</div>
                        ${(lang === 'zh' ? item.notes_zh : item.notes_en) ? `<div class="agenda-notes">${lang === 'zh' ? item.notes_zh : item.notes_en}</div>` : ''}
                    </div>
                </div>
            `).join('');
        }

        // 載入交通資訊
        async function loadTraffic() {
            try {
                const data = await apiFetch('getTraffic');
            siteData.traffic = data.data;
            renderTraffic();
            } catch (error) {
                console.error('載入交通資訊失敗:', error);
            }
        }

        // 渲染交通資訊（Google Maps iframe 左側 + 資訊卡片右側）
        function renderTraffic() {
            const container = document.getElementById('traffic-content');
            const traffic = siteData.traffic || [];
            const lang = currentLang;
            const mapsEmbed = siteData.settings && siteData.settings.google_maps_embed;

            if (traffic.length === 0 && !mapsEmbed) {
                container.innerHTML = '<div class="loading-section">目前沒有交通資訊</div>';
                return;
            }

            // 圖示對應 type
            const typeIcons = {
                address: 'fas fa-map-marker-alt',
                mrt: 'fas fa-train',
                bus: 'fas fa-bus',
                car: 'fas fa-car',
                parking: 'fas fa-parking',
                taxi: 'fas fa-taxi',
                bike: 'fas fa-bicycle',
                plane: 'fas fa-plane',
                default: 'fas fa-info-circle'
            };

            const mapHtml = mapsEmbed
                ? `<div class="traffic-map-container">
                     <iframe src="${mapsEmbed}" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                   </div>`
                : `<div class="traffic-map-container">
                     <div class="traffic-map-placeholder">
                       <i class="fas fa-map-marked-alt"></i>
                       <p>${lang === 'zh' ? '地圖載入中，請至後台設定 Google Maps 嵌入碼' : 'Set Google Maps embed code in admin panel'}</p>
                     </div>
                   </div>`;

            const cardsHtml = traffic.map(item => {
                const iconClass = typeIcons[item.type] || typeIcons.default;
                const title = lang === 'zh' ? item.title_zh : item.title_en;
                const text = lang === 'zh' ? item.content_zh : item.content_en;
                // 若 type 為 address，加上開啟 Google Maps 按鈕
                const mapsBtn = (item.type === 'address' && mapsEmbed)
                    ? `<a class="traffic-open-map-btn" href="https://maps.google.com/?q=${encodeURIComponent(text)}" target="_blank" rel="noopener">
                         <i class="fas fa-external-link-alt"></i>
                         ${lang === 'zh' ? '在 Google Maps 開啟' : 'Open in Google Maps'}
                       </a>`
                    : '';
                return `<div class="traffic-card">
                    <div class="traffic-icon"><i class="${iconClass}"></i></div>
                    <div class="traffic-card-body">
                        <h3>${title}</h3>
                        <p>${text}</p>
                        ${mapsBtn}
                    </div>
                </div>`;
            }).join('');

            container.innerHTML = `<div class="traffic-layout">${mapHtml}<div class="traffic-info-list">${cardsHtml}</div></div>`;
        }

        // 載入個資宣告
        async function loadPrivacy() {
            try {
                const data = await apiFetch('getPrivacy');
            siteData.privacy = data.data;
            } catch (error) {
                console.error('載入個資宣告失敗:', error);
            }
        }

        // 載入歷年會議
        async function loadPastEvents() {
            try {
                const data = await apiFetch('getPastEvents');
            siteData.pastEvents = data.data;
            renderPastEvents();
            } catch (error) {
                console.error('載入歷年會議失敗:', error);
            }
        }

        // 渲染歷年會議
        function renderPastEvents() {
            const container = document.getElementById('past-events-content');
            const events = siteData.pastEvents || [];
            const lang = currentLang;

            if (events.length === 0) {
                container.innerHTML = '<div class="loading-section">目前沒有歷年會議資料</div>';
                return;
            }

            container.innerHTML = events.map(event => `
                <div class="past-event-card">
                    <div class="past-event-image">
                        ${event.featured_image_url ? `<img src="${event.featured_image_url}" alt="${lang === 'zh' ? event.title_zh : event.title_en}" style="width: 100%; height: 100%; object-fit: cover;">` : '<i class="fas fa-images"></i>'}
                    </div>
                    <div class="past-event-content">
                        <div class="past-event-year">${event.year}</div>
                        <div class="past-event-title">${lang === 'zh' ? event.title_zh : event.title_en}</div>
                        <div class="past-event-desc">${lang === 'zh' ? event.description_zh : event.description_en}</div>
                        ${event.album_url ? `<a href="${event.album_url}" target="_blank" class="past-event-link"><i class="fas fa-external-link-alt"></i> ${lang === 'zh' ? '查看相簿' : 'View Album'}</a>` : ''}
                    </div>
                </div>
            `).join('');
        }

        // 顯示講師詳細資訊（第二層 Modal）
        function showSpeakerDetail(speakerId) {
            const sp = siteData.speakers.find(s => s.id === speakerId);
            if (!sp) return;

            const lang = currentLang;
            const name = lang === 'zh' ? sp.name_zh : sp.name_en;
            const title = lang === 'zh' ? sp.title_zh : sp.title_en;
            const org = lang === 'zh' ? sp.organization_zh : sp.organization_en;
            const bio = lang === 'zh' ? sp.full_bio_zh : sp.full_bio_en;
            const topic = lang === 'zh' ? sp.topic_zh : sp.topic_en;
            const expertise = lang === 'zh' ? sp.expertise_zh : sp.expertise_en;

            const photoHtml = sp.photo_url
                ? `<img src="${sp.photo_url}" alt="${name}">`
                : '<i class="fas fa-user"></i>';

            document.getElementById('speaker-detail-content').innerHTML = `
                <div class="speaker-detail">
                    <div class="speaker-detail-avatar">${photoHtml}</div>
                    <div class="speaker-detail-body">
                        <h3>${name}</h3>
                        <div class="tag-row">
                            <span class="speaker-tag"><i class="fas fa-briefcase"></i> ${title}</span>
                            <span class="speaker-tag"><i class="fas fa-university"></i> ${org}</span>
                        </div>
                        ${bio ? `<div class="speaker-section-label">${lang === 'zh' ? '個人簡介' : 'Biography'}</div><p>${bio}</p>` : ''}
                        ${topic ? `<div class="speaker-section-label">${lang === 'zh' ? '演講題目' : 'Presentation Topic'}</div><p>${topic}</p>` : ''}
                        ${expertise ? `<div class="speaker-section-label">${lang === 'zh' ? '專長領域' : 'Expertise'}</div><p>${expertise}</p>` : ''}
                    </div>
                </div>`;

            document.getElementById('speaker-modal').classList.add('show');
        }

        // 初始化報名按鈕
        function initRegisterButtons() {
            const registerBtn = document.getElementById('register-btn');
            const floatingBtn = document.getElementById('floating-register-btn');

            [registerBtn, floatingBtn].forEach(btn => {
                if (btn) {
                    btn.addEventListener('click', showPrivacyModal);
                }
            });
        }

        // 顯示個資宣告 Modal
        function showPrivacyModal() {
            if (siteData.settings.registration_status !== 'open') return;

            const modal = document.getElementById('privacy-modal');
            const title = document.getElementById('privacy-title');
            const content = document.getElementById('privacy-content');
            const checkboxText = document.getElementById('privacy-checkbox-text');
            const checkbox = document.getElementById('privacy-checkbox');
            const confirmBtn = document.getElementById('privacy-confirm');

            if (siteData.privacy) {
                title.textContent = currentLang === 'zh' ? siteData.privacy.title_zh : siteData.privacy.title_en;
                content.innerHTML = currentLang === 'zh' ? siteData.privacy.content_zh : siteData.privacy.content_en;
                checkboxText.textContent = currentLang === 'zh' ? siteData.privacy.checkbox_text_zh : siteData.privacy.checkbox_text_en;
            }

            checkbox.checked = false;
            confirmBtn.disabled = true;

            modal.classList.add('show');
        }

        // 初始化語言切換
        function initLanguage() {
            const langBtns = document.querySelectorAll('.lang-btn');

            langBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const lang = btn.dataset.lang;
                    setLanguage(lang);
                });
            });

            updateLanguageUI();
            // 頁面初始化時立即套用語言（含導航選單）
            updateTitles();
        }

        // 設定語言
        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('conference-lang', lang);
            updateLanguageUI();
            updateContent();
        }

        // 更新語言UI
        function updateLanguageUI() {
            const langBtns = document.querySelectorAll('.lang-btn');
            langBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === currentLang);
            });
        }

        // 更新內容語言（語言切換 & 資料載入後都會呼叫）
        function updateContent() {
            if (siteData.settings) {
                updateHero();
                updateCountdown();
                updateRegisterButton();
            }
            if (siteData.about)      renderAbout();
            if (siteData.speakers)   renderSpeakers();
            if (siteData.agenda)     renderAgenda();
            if (siteData.traffic)    renderTraffic();
            if (siteData.pastEvents) renderPastEvents();

            // 導航選單、section 標題、UI 文字
            updateTitles();
        }

        // 更新所有標題
        function updateTitles() {
            const isEn = currentLang !== 'zh';

            // ── Section 標題 ──
            const titles = {
                'about-title':         ['會議介紹', 'About Conference'],
                'about-subtitle':      ['了解本次會議的詳細內容', 'Learn about the conference details'],
                'speakers-title':      ['講師介紹', 'Speakers'],
                'speakers-subtitle':   ['來自各領域的專業講師', 'Professional speakers from various fields'],
                'agenda-title':        ['會議議程', 'Conference Agenda'],
                'agenda-subtitle':     ['完整的會議時程安排', 'Complete conference schedule'],
                'traffic-title':       ['交通資訊', 'Transportation'],
                'traffic-subtitle':    ['如何前往會場', 'How to get to the venue'],
                'past-events-title':   ['歷年會議', 'Past Events'],
                'past-events-subtitle':['回顧過往精彩活動', 'Review past wonderful events']
            };

            Object.keys(titles).forEach(id => {
                const el = document.getElementById(id);
                if (el) el.textContent = titles[id][isEn ? 1 : 0];
            });

            // ── 導航選單文字：讀 data-zh / data-en ──
            document.querySelectorAll('.navbar-link[data-zh]').forEach(link => {
                link.textContent = isEn ? (link.dataset.en || link.dataset.zh) : link.dataset.zh;
            });

            // ── 浮動按鈕文字 ──
            const floatingLabel = document.getElementById('floating-btn-label');
            if (floatingLabel) floatingLabel.textContent = isEn ? 'Register Now' : '立即報名';

            // ── 個資 Modal 按鈕文字 ──
            const privacyConfirm = document.getElementById('privacy-confirm');
            if (privacyConfirm) privacyConfirm.textContent = isEn ? 'Go to Registration Form' : '前往報名表單';
            const privacyCancel = document.getElementById('privacy-cancel');
            if (privacyCancel) privacyCancel.textContent = isEn ? 'Cancel' : '取消';

            // ── 倒數計時標籤 ──
            const cdLabels = document.querySelectorAll('.countdown-label');
            const cdTexts = isEn
                ? ['Days', 'Hours', 'Minutes', 'Seconds']
                : ['天', '時', '分', '秒'];
            cdLabels.forEach((el, i) => { if (cdTexts[i]) el.textContent = cdTexts[i]; });

            // ── 查看詳細按鈕（重新渲染時會自帶，這裡補靜態備用）──
            document.querySelectorAll('.speaker-detail-btn').forEach(btn => {
                const icon = btn.querySelector('i');
                btn.innerHTML = '';
                if (icon) btn.appendChild(icon);
                btn.append(` ${isEn ? 'View Profile' : '查看詳細'}`);
            });
        }

        // 初始化手機選單
        function initMobileMenu() {
            const toggle = document.getElementById('mobile-menu-toggle');
            const menu = document.getElementById('navbar-menu');

            toggle.addEventListener('click', () => {
                menu.classList.toggle('mobile-menu-open');
                toggle.classList.toggle('active');
            });

            // 點擊選單項目後關閉手機選單
            const menuLinks = menu.querySelectorAll('.navbar-link');
            menuLinks.forEach(link => {
                link.addEventListener('click', () => {
                    menu.classList.remove('mobile-menu-open');
                    toggle.classList.remove('active');
                });
            });
        }

        // 工具函數
        function showLoading(show) {
            const loading = document.getElementById('loading-state');
            if (show) {
                loading.classList.remove('hidden');
            } else {
                loading.classList.add('hidden');
            }
        }

        function showError(message) {
            alert(message);
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString(currentLang === 'zh' ? 'zh-TW' : 'en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }

        // Modal 事件監聽
        document.getElementById('privacy-modal-close').addEventListener('click', () => {
            document.getElementById('privacy-modal').classList.remove('show');
        });

        document.getElementById('privacy-cancel').addEventListener('click', () => {
            document.getElementById('privacy-modal').classList.remove('show');
        });

        document.getElementById('privacy-checkbox').addEventListener('change', (e) => {
            document.getElementById('privacy-confirm').disabled = !e.target.checked;
        });

        document.getElementById('privacy-confirm').addEventListener('click', () => {
            const formUrl = siteData.settings.registration_form_url;
            if (formUrl) {
                window.open(formUrl, '_blank', 'noopener,noreferrer');
            }
            document.getElementById('privacy-modal').classList.remove('show');
        });

        document.getElementById('speaker-modal-close').addEventListener('click', () => {
            document.getElementById('speaker-modal').classList.remove('show');
        });

        // 點擊 Modal 背景關閉
        document.getElementById('privacy-modal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) {
                e.target.classList.remove('show');
            }
        });

        document.getElementById('speaker-modal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) {
                e.target.classList.remove('show');
            }
        });

        // 平滑滾動到區塊
        document.querySelectorAll('.navbar-link[data-section]').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const section = document.getElementById(link.dataset.section + '-section');
                if (section) {
                    section.scrollIntoView({ behavior: 'smooth' });
                }
            });
        });
    </script>
</body>
</html>
