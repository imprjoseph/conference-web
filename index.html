<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會議活動官方網站</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* CSS 樣式 */
        :root {
            --primary-color: #1e40af;
            --primary-light: #3b82f6;
            --primary-dark: #1e3a8a;
            --secondary-color: #64748b;
            --accent-color: #f59e0b;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --text-color: #1f2937;
            --text-light: #6b7280;
            --bg-color: #ffffff;
            --bg-light: #f8fafc;
            --bg-gray: #f1f5f9;
            --border-color: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --border-radius: 8px;
            --border-radius-lg: 12px;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--bg-color);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* 載入動畫 */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 200px;
            flex-direction: column;
            gap: 20px;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border-color);
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 導航欄 */
        .navbar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 0;
        }

        .navbar-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .navbar-brand {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary-color);
            text-decoration: none;
        }

        .navbar-menu {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .navbar-link {
            color: var(--text-color);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
            padding: 8px 16px;
            border-radius: var(--border-radius);
        }

        .navbar-link:hover,
        .navbar-link.active {
            color: var(--primary-color);
            background-color: var(--bg-light);
        }

        .language-switch {
            display: flex;
            gap: 5px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            overflow: hidden;
        }

        .lang-btn {
            padding: 6px 12px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 14px;
            transition: var(--transition);
        }

        .lang-btn.active {
            background-color: var(--primary-color);
            color: white;
        }

        .mobile-menu-toggle {
            display: none;
            flex-direction: column;
            cursor: pointer;
            gap: 4px;
        }

        .mobile-menu-toggle span {
            width: 25px;
            height: 3px;
            background-color: var(--text-color);
            transition: var(--transition);
        }

        /* Hero 區塊 */
        .hero {
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary-color) 100%);
            color: white;
            padding: 120px 20px 80px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="25" cy="25" r="1" fill="rgba(255,255,255,0.1)"/><circle cx="75" cy="75" r="1" fill="rgba(255,255,255,0.05)"/><circle cx="50" cy="10" r="0.5" fill="rgba(255,255,255,0.08)"/></pattern></defs><rect width="100" height="100" fill="url(%23grain)"/></svg>');
            opacity: 0.1;
        }

        .hero-content {
            position: relative;
            z-index: 1;
            max-width: 800px;
            margin: 0 auto;
        }

        .hero-image {
            width: 100%;
            max-width: 600px;
            height: 300px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: var(--border-radius-lg);
            margin: 0 auto 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            backdrop-filter: blur(10px);
        }

        .hero-title {
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 16px;
            line-height: 1.2;
        }

        .hero-subtitle {
            font-size: 24px;
            font-weight: 400;
            margin-bottom: 32px;
            opacity: 0.9;
        }

        .hero-meta {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .hero-meta-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .hero-meta-label {
            font-size: 14px;
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .hero-meta-value {
            font-size: 18px;
            font-weight: 600;
        }

        .hero-actions {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 16px 32px;
            border-radius: var(--border-radius);
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: var(--transition);
            border: none;
            cursor: pointer;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: #d97706;
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .btn-outline {
            background-color: transparent;
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .btn-outline:hover {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.5);
        }

        /* 倒數計時 */
        .countdown {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: var(--border-radius-lg);
            padding: 30px;
            margin: 40px auto 0;
            max-width: 600px;
        }

        .countdown-title {
            font-size: 18px;
            margin-bottom: 20px;
            opacity: 0.9;
        }

        .countdown-timer {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .countdown-item {
            text-align: center;
            min-width: 80px;
        }

        .countdown-number {
            font-size: 36px;
            font-weight: 800;
            display: block;
            line-height: 1;
        }

        .countdown-label {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* 區塊標題 */
        .section {
            padding: 80px 0;
        }

        .section-title {
            text-align: center;
            margin-bottom: 60px;
        }

        .section-title h2 {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text-color);
        }

        .section-title p {
            font-size: 18px;
            color: var(--text-light);
            max-width: 600px;
            margin: 0 auto;
        }

        /* 關於會議 */
        .about-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
        }

        .about-card {
            background: var(--bg-color);
            border-radius: var(--border-radius-lg);
            padding: 40px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .about-card h3 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text-color);
        }

        .about-card p {
            color: var(--text-light);
            line-height: 1.7;
            margin-bottom: 20px;
        }

        .about-card img {
            width: 100%;
            border-radius: var(--border-radius);
            margin-top: 20px;
        }

        /* 講師區塊 */
        .speakers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        .speaker-card {
            background: var(--bg-color);
            border-radius: var(--border-radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            transition: var(--transition);
        }

        .speaker-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
        }

        .speaker-image {
            width: 100%;
            height: 200px;
            background: var(--bg-gray);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: var(--text-light);
        }

        .speaker-content {
            padding: 24px;
        }

        .speaker-name {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-color);
        }

        .speaker-title {
            font-size: 16px;
            color: var(--primary-color);
            margin-bottom: 4px;
        }

        .speaker-org {
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 16px;
        }

        .speaker-bio {
            font-size: 14px;
            color: var(--text-light);
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .speaker-link {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
        }

        .speaker-link:hover {
            text-decoration: underline;
        }

        /* 議程區塊 */
        .agenda-container {
            background: var(--bg-light);
            border-radius: var(--border-radius-lg);
            padding: 40px;
            margin-top: 40px;
        }

        .agenda-item {
            display: flex;
            gap: 30px;
            padding: 30px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .agenda-item:last-child {
            border-bottom: none;
        }

        .agenda-time {
            min-width: 120px;
            font-weight: 600;
            color: var(--primary-color);
            font-size: 16px;
        }

        .agenda-content {
            flex: 1;
        }

        .agenda-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-color);
        }

        .agenda-speaker {
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 4px;
        }

        .agenda-location {
            font-size: 14px;
            color: var(--text-light);
        }

        .agenda-notes {
            font-size: 14px;
            color: var(--text-light);
            font-style: italic;
            margin-top: 8px;
        }

        /* 交通資訊 */
        .traffic-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .traffic-card {
            background: var(--bg-color);
            border-radius: var(--border-radius-lg);
            padding: 30px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .traffic-card h3 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-color);
        }

        .traffic-card p {
            color: var(--text-light);
            line-height: 1.6;
        }

        .traffic-map {
            margin-top: 20px;
            border-radius: var(--border-radius);
            overflow: hidden;
        }

        /* 歷年會議 */
        .past-events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .past-event-card {
            background: var(--bg-color);
            border-radius: var(--border-radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            transition: var(--transition);
        }

        .past-event-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
        }

        .past-event-image {
            width: 100%;
            height: 200px;
            background: var(--bg-gray);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: var(--text-light);
        }

        .past-event-content {
            padding: 24px;
        }

        .past-event-year {
            font-size: 14px;
            color: var(--primary-color);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .past-event-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-color);
        }

        .past-event-desc {
            font-size: 14px;
            color: var(--text-light);
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .past-event-link {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
        }

        .past-event-link:hover {
            text-decoration: underline;
        }

        /* 浮動報名按鈕 */
        .floating-register {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 1000;
        }

        .floating-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--accent-color);
            color: white;
            border: none;
            font-size: 24px;
            cursor: pointer;
            box-shadow: var(--shadow-lg);
            transition: var(--transition);
        }

        .floating-btn:hover {
            background: #d97706;
            transform: scale(1.1);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: var(--bg-color);
            border-radius: var(--border-radius-lg);
            padding: 40px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-light);
        }

        .modal-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text-color);
        }

        .modal-body {
            margin-bottom: 30px;
        }

        .privacy-content {
            max-height: 300px;
            overflow-y: auto;
            padding: 20px;
            background: var(--bg-light);
            border-radius: var(--border-radius);
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.6;
        }

        .privacy-checkbox {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 20px;
        }

        .privacy-checkbox input {
            margin-top: 4px;
        }

        .privacy-checkbox label {
            font-size: 14px;
            color: var(--text-light);
            line-height: 1.5;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .btn-secondary {
            background-color: var(--secondary-color);
            color: white;
        }

        .btn-secondary:hover {
            background-color: #475569;
        }

        /* 講師詳細資訊 Modal */
        .speaker-modal .modal-content {
            max-width: 800px;
        }

        .speaker-detail {
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 30px;
            align-items: start;
        }

        .speaker-detail-image {
            width: 200px;
            height: 200px;
            background: var(--bg-gray);
            border-radius: var(--border-radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: var(--text-light);
        }

        .speaker-detail-content h3 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .speaker-detail-content .speaker-title,
        .speaker-detail-content .speaker-org {
            margin-bottom: 20px;
        }

        .speaker-detail-content h4 {
            font-size: 18px;
            font-weight: 600;
            margin: 20px 0 10px 0;
            color: var(--text-color);
        }

        .speaker-detail-content p {
            line-height: 1.6;
            color: var(--text-light);
        }

        /* 狀態頁面 */
        .status-page {
            min-height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }

        .status-icon {
            font-size: 64px;
            margin-bottom: 24px;
            opacity: 0.5;
        }

        .status-title {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-color);
        }

        .status-message {
            font-size: 18px;
            color: var(--text-light);
            max-width: 500px;
            margin: 0 auto;
        }

        /* 響應式設計 */
        @media (max-width: 768px) {
            .navbar-menu {
                display: none;
            }

            .mobile-menu-toggle {
                display: flex;
            }

            .hero {
                padding: 100px 20px 60px;
            }

            .hero-title {
                font-size: 32px;
            }

            .hero-subtitle {
                font-size: 18px;
            }

            .hero-meta {
                gap: 20px;
            }

            .hero-actions {
                flex-direction: column;
                align-items: center;
            }

            .section {
                padding: 60px 0;
            }

            .section-title h2 {
                font-size: 28px;
            }

            .about-grid,
            .speakers-grid,
            .traffic-grid,
            .past-events-grid {
                grid-template-columns: 1fr;
            }

            .agenda-item {
                flex-direction: column;
                gap: 15px;
            }

            .agenda-time {
                min-width: auto;
            }

            .floating-register {
                bottom: 20px;
                right: 20px;
            }

            .floating-btn {
                width: 50px;
                height: 50px;
                font-size: 20px;
            }

            .modal-content {
                padding: 30px 20px;
                margin: 20px;
            }

            .speaker-detail {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .speaker-detail-image {
                width: 150px;
                height: 150px;
                margin: 0 auto;
            }
        }

        @media (max-width: 480px) {
            .hero-meta {
                flex-direction: column;
                gap: 15px;
            }

            .countdown-timer {
                gap: 15px;
            }

            .countdown-item {
                min-width: 60px;
            }

            .countdown-number {
                font-size: 28px;
            }

            .modal-actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }

        /* 隱藏類別 */
        .hidden {
            display: none !important;
        }

        /* 載入狀態 */
        .loading-section {
            text-align: center;
            padding: 40px;
        }
    </style>
</head>
<body>
    <!-- 導航欄 -->
    <nav class="navbar">
        <div class="navbar-content">
            <a href="#" class="navbar-brand" id="site-title">會議活動</a>
            <div class="mobile-menu-toggle" id="mobile-menu-toggle">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <div class="navbar-menu" id="navbar-menu">
                <a href="#about" class="navbar-link" data-section="about">會議介紹</a>
                <a href="#speakers" class="navbar-link" data-section="speakers">講師介紹</a>
                <a href="#agenda" class="navbar-link" data-section="agenda">會議議程</a>
                <a href="#traffic" class="navbar-link" data-section="traffic">交通資訊</a>
                <a href="#past-events" class="navbar-link" data-section="past-events">歷年會議</a>
                <div class="language-switch">
                    <button class="lang-btn active" data-lang="zh">中文</button>
                    <button class="lang-btn" data-lang="en">English</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主要內容 -->
    <main id="main-content">
        <!-- 載入中狀態 -->
        <div id="loading-state" class="loading">
            <div class="loading-spinner"></div>
            <p>載入中...</p>
        </div>

        <!-- 建置中狀態 -->
        <div id="draft-state" class="status-page hidden">
            <div>
                <div class="status-icon">🔧</div>
                <h1 class="status-title" id="draft-title">網站建置中</h1>
                <p class="status-message" id="draft-message">網站正在建置中，請稍後再訪。</p>
            </div>
        </div>

    <script>
        // 全域變數
        let currentLang = localStorage.getItem('conference-lang') || 'zh';
        let siteData = {};
        let countdownInterval;

        // API 基礎 URL（請更換為您的 Apps Script Web App URL）
        const API_BASE_URL = 'https://script.google.com/macros/s/AKfycbw_RE3C83F-LjOXqvB0sRoJbsC4B_bcdclucEfMWROUOiyM5XmS2EdmlnoeeA0HP2z_3Q/exec';
        const API_FALLBACK_URLS = [
            'https://script.google.com/macros/s/AKfycbwBcXiRx_0ylBkRqjrQ_96moYWDWuK9d8wClnOjeTosT9TOIBV7SWI72pBAFJtU0uF_fA/exec'
        ];
        let activeApiBaseUrl = API_BASE_URL;

        async function apiFetch(action, init = {}) {
            const candidates = [activeApiBaseUrl, ...API_FALLBACK_URLS.filter(url => url !== activeApiBaseUrl)];
            let lastError = null;

            for (const baseUrl of candidates) {
                const url = `${baseUrl}?action=${action}`;
                try {
                    const response = await fetch(url, init);
                    if (!response.ok) {
                        lastError = new Error(`API ${action} failed: ${response.status} ${response.statusText} @ ${baseUrl}`);
                        continue;
                    }

                    const data = await response.json();
                    if (data && data.success) {
                        if (baseUrl !== activeApiBaseUrl) {
                            activeApiBaseUrl = baseUrl;
                            console.warn(`已切換 API 端點至：${baseUrl}`);
                        }
                        return data;
                    }

                    lastError = new Error(data && data.error ? data.error : `API ${action} 回傳格式錯誤 @ ${baseUrl}`);
                } catch (error) {
                    lastError = error;
                }
            }

            throw lastError;
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            initLanguage();
            initMobileMenu();
            loadSiteData();
        });

        // 載入網站資料
        async function loadSiteData() {
            try {
                showLoading(true);

                // 載入設定
                const settingsData = await apiFetch('getSettings');
                siteData.settings = settingsData.data;

                // 檢查網站狀態
                checkSiteStatus();

                // 如果網站正常運作，載入其他資料
                if (siteData.settings.site_status === 'live') {
                    await loadAllData();
                }

            } catch (error) {
                console.error('載入資料失敗:', error);
                showError('載入資料失敗，請稍後再試');
            } finally {
                showLoading(false);
            }
        }

        // 檢查網站狀態
        function checkSiteStatus() {
            const status = siteData.settings.site_status;

            if (status === 'draft') {
                showDraftPage();
            } else if (status === 'closed') {
                showClosedPage();
            } else if (status === 'live') {
                showLiveContent();
            }
        }

        // 顯示建置中頁面
        function showDraftPage() {
            document.getElementById('loading-state').classList.add('hidden');
            document.getElementById('draft-state').classList.remove('hidden');

            const titleEl = document.getElementById('draft-title');
            const messageEl = document.getElementById('draft-message');

            titleEl.textContent = currentLang === 'zh' ?
                siteData.settings.maintenance_message_zh || '網站建置中' :
                siteData.settings.maintenance_message_en || 'Website under construction';

            messageEl.textContent = currentLang === 'zh' ?
                siteData.settings.maintenance_message_zh || '網站正在建置中，請稍後再訪。' :
                siteData.settings.maintenance_message_en || 'Website under construction, please visit later.';
        }

        // 顯示活動結束頁面
        function showClosedPage() {
            document.getElementById('loading-state').classList.add('hidden');
            document.getElementById('closed-state').classList.remove('hidden');

            const titleEl = document.getElementById('closed-title');
            const messageEl = document.getElementById('closed-message');

            titleEl.textContent = currentLang === 'zh' ?
                siteData.settings.closed_message_zh || '活動已圓滿結束' :
                siteData.settings.closed_message_en || 'Event has ended successfully';

            messageEl.textContent = currentLang === 'zh' ?
                siteData.settings.closed_message_zh || '感謝您的參與，歡迎關注我們下次的活動。' :
                siteData.settings.closed_message_en || 'Thank you for your participation, welcome to follow our next event.';
        }

        // 顯示正常內容
        function showLiveContent() {
            document.getElementById('loading-state').classList.add('hidden');
            document.getElementById('hero-section').classList.remove('hidden');
            document.getElementById('about-section').classList.remove('hidden');
            document.getElementById('speakers-section').classList.remove('hidden');
            document.getElementById('agenda-section').classList.remove('hidden');
            document.getElementById('traffic-section').classList.remove('hidden');
            document.getElementById('past-events-section').classList.remove('hidden');
            document.getElementById('floating-register').classList.remove('hidden');
        }

        // 載入所有資料
        async function loadAllData() {
            const promises = [
                loadAbout(),
                loadSpeakers(),
                loadAgenda(),
                loadTraffic(),
                loadPrivacy(),
                loadPastEvents()
            ];

            await Promise.all(promises);
            updateHero();
            updateCountdown();
            initRegisterButtons();
        }

        // 更新 Hero 區塊
        function updateHero() {
            const settings = siteData.settings;

            document.getElementById('site-title').textContent = currentLang === 'zh' ?
                settings.conference_title_zh || '會議活動' :
                settings.conference_title_en || 'Conference';

            document.getElementById('hero-title').textContent = currentLang === 'zh' ?
                settings.conference_title_zh || '會議名稱' :
                settings.conference_title_en || 'Conference Title';

            document.getElementById('hero-subtitle').textContent = currentLang === 'zh' ?
                settings.conference_subtitle_zh || '會議副標題' :
                settings.conference_subtitle_en || 'Conference Subtitle';

            document.getElementById('hero-date').textContent = settings.conference_date || '-';
            document.getElementById('hero-location').textContent = currentLang === 'zh' ?
                settings.conference_location_zh || '-' :
                settings.conference_location_en || '-';

            // 更新報名按鈕狀態
            updateRegisterButton();
        }

        // 更新報名按鈕狀態
        function updateRegisterButton() {
            const status = siteData.settings.registration_status;
            const btn = document.getElementById('register-btn');
            const btnText = document.getElementById('register-btn-text');
            const floatingBtn = document.getElementById('floating-register-btn');

            if (status === 'coming_soon') {
                btnText.textContent = currentLang === 'zh' ? '報名尚未開放' : 'Registration Coming Soon';
                btn.disabled = true;
                btn.style.opacity = '0.6';
                floatingBtn.style.display = 'none';
            } else if (status === 'open') {
                btnText.textContent = currentLang === 'zh' ? '立即報名' : 'Register Now';
                btn.disabled = false;
                btn.style.opacity = '1';
                floatingBtn.style.display = 'block';
            } else if (status === 'closed') {
                btnText.textContent = currentLang === 'zh' ? '報名已截止' : 'Registration Closed';
                btn.disabled = true;
                btn.style.opacity = '0.6';
                floatingBtn.style.display = 'none';
            }
        }

        // 更新倒數計時
        function updateCountdown() {
            const settings = siteData.settings;
            const now = new Date();
            let targetDate;
            let titleText;

            const registrationEnd = settings.registration_end_at ? new Date(settings.registration_end_at) : null;
            const eventStart = settings.event_start_at ? new Date(settings.event_start_at) : null;
            const eventEnd = settings.event_end_at ? new Date(settings.event_end_at) : null;

            if (now < (registrationEnd || new Date())) {
                // 報名期間
                targetDate = registrationEnd;
                titleText = currentLang === 'zh' ? '距離報名截止還有' : 'Registration closes in';
            } else if (now < (eventStart || new Date())) {
                // 報名結束後到活動開始前
                targetDate = eventStart;
                titleText = currentLang === 'zh' ? '距離會議開始還有' : 'Event starts in';
            } else if (now < (eventEnd || new Date())) {
                // 活動進行中
                document.getElementById('countdown-title').textContent = currentLang === 'zh' ? '會議進行中' : 'Event in progress';
                document.getElementById('countdown-timer').innerHTML = '<div style="font-size: 24px; color: var(--success-color);">🎉</div>';
                return;
            } else {
                // 活動結束
                document.getElementById('countdown-title').textContent = currentLang === 'zh' ? '會議已圓滿結束' : 'Event has ended successfully';
                document.getElementById('countdown-timer').innerHTML = '<div style="font-size: 24px; color: var(--success-color);">✅</div>';
                return;
            }

            if (!targetDate) {
                document.getElementById('countdown-section').style.display = 'none';
                return;
            }

            document.getElementById('countdown-title').textContent = titleText;

            // 清除舊的計時器
            if (countdownInterval) {
                clearInterval(countdownInterval);
            }

            // 開始倒數
            countdownInterval = setInterval(() => {
                const now = new Date();
                const diff = targetDate - now;

                if (diff <= 0) {
                    updateCountdown();
                    return;
                }

                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));

                document.getElementById('days').textContent = days.toString().padStart(2, '0');
                document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
                document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
            }, 1000);
        }

        // 載入會議介紹
        async function loadAbout() {
            try {
                const data = await apiFetch('getAbout');
            siteData.about = data.data;
            renderAbout();
            } catch (error) {
                console.error('載入會議介紹失敗:', error);
            }
        }

        // 渲染會議介紹
        function renderAbout() {
            const container = document.getElementById('about-content');
            const about = siteData.about || [];

            if (about.length === 0) {
                container.innerHTML = '<div class="loading-section">目前沒有會議介紹內容</div>';
                return;
            }

            container.innerHTML = about.map(item => `
                <div class="about-card">
                    <h3>${currentLang === 'zh' ? item.title_zh : item.title_en}</h3>
                    <p>${currentLang === 'zh' ? item.content_zh : item.content_en}</p>
                    ${item.image_url ? `<img src="${item.image_url}" alt="${currentLang === 'zh' ? item.title_zh : item.title_en}">` : ''}
                </div>
            `).join('');
        }

        // 載入講師資料
        async function loadSpeakers() {
            try {
                const data = await apiFetch('getSpeakers');
            siteData.speakers = data.data;
            renderSpeakers();
            } catch (error) {
                console.error('載入講師資料失敗:', error);
            }
        }

        // 渲染講師
        function renderSpeakers() {
            const container = document.getElementById('speakers-content');
            const speakers = siteData.speakers || [];

            if (speakers.length === 0) {
                container.innerHTML = '<div class="loading-section">目前沒有講師資料</div>';
                return;
            }

            container.innerHTML = speakers.map(speaker => `
                <div class="speaker-card">
                    <div class="speaker-image">
                        ${speaker.photo_url ? `<img src="${speaker.photo_url}" alt="${currentLang === 'zh' ? speaker.name_zh : speaker.name_en}" style="width: 100%; height: 100%; object-fit: cover;">` : '<i class="fas fa-user"></i>'}
                    </div>
                    <div class="speaker-content">
                        <div class="speaker-name">${currentLang === 'zh' ? speaker.name_zh : speaker.name_en}</div>
                        <div class="speaker-title">${currentLang === 'zh' ? speaker.title_zh : speaker.title_en}</div>
                        <div class="speaker-org">${currentLang === 'zh' ? speaker.organization_zh : speaker.organization_en}</div>
                        <div class="speaker-bio">${currentLang === 'zh' ? speaker.short_bio_zh : speaker.short_bio_en}</div>
                        <a href="#" class="speaker-link" onclick="showSpeakerDetail('${speaker.id}')">
                            <i class="fas fa-info-circle"></i> ${currentLang === 'zh' ? '詳細介紹' : 'More Info'}
                        </a>
                    </div>
                </div>
            `).join('');
        }

        // 載入議程
        async function loadAgenda() {
            try {
                const data = await apiFetch('getAgenda');
            siteData.agenda = data.data;
            renderAgenda();
            } catch (error) {
                console.error('載入議程失敗:', error);
            }
        }

        // 渲染議程
        function renderAgenda() {
            const container = document.getElementById('agenda-content');
            const agenda = siteData.agenda || [];

            if (agenda.length === 0) {
                container.innerHTML = '<div class="loading-section">目前沒有議程資料</div>';
                return;
            }

            // 按日期和時間排序
            agenda.sort((a, b) => {
                const dateA = new Date(a.date + ' ' + a.start_time);
                const dateB = new Date(b.date + ' ' + b.start_time);
                return dateA - dateB;
            });

            container.innerHTML = agenda.map(item => `
                <div class="agenda-item">
                    <div class="agenda-time">
                        ${item.start_time} - ${item.end_time}<br>
                        <small>${formatDate(item.date)}</small>
                    </div>
                    <div class="agenda-content">
                        <div class="agenda-title">${currentLang === 'zh' ? item.title_zh : item.title_en}</div>
                        <div class="agenda-speaker">${currentLang === 'zh' ? item.speaker_zh : item.speaker_en}</div>
                        <div class="agenda-location">${currentLang === 'zh' ? item.location_zh : item.location_en}</div>
                        ${(currentLang === 'zh' ? item.notes_zh : item.notes_en) ? `<div class="agenda-notes">${currentLang === 'zh' ? item.notes_zh : item.notes_en}</div>` : ''}
                    </div>
                </div>
            `).join('');
        }

        // 載入交通資訊
        async function loadTraffic() {
            try {
                const data = await apiFetch('getTraffic');
            siteData.traffic = data.data;
            renderTraffic();

                console.error('載入交通資訊失敗:', error);

        function renderTraffic() {
            const container = document.getElementById('traffic-content');

            if (traffic.length === 0) {
                container.innerHTML = '<div class="loading-section">目前沒有交通資訊</div>';

            container.innerHTML = traffic.map(item => `
                <div class="traffic-card">
                    <h3>${currentLang === 'zh' ? item.title_zh : item.title_en}</h3>
                    <p>${currentLang === 'zh' ? item.content_zh : item.content_en}</p>
                    ${item.type === 'map' && siteData.settings.google_maps_embed ? `
                        <div class="traffic-map">
                            <iframe src="${siteData.settings.google_maps_embed}" width="100%" height="300" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
                        </div>
                    ` : ''}

            `).join('');

                    </div>
                </div>

        // 顯示講師詳細資訊
        function showSpeakerDetail(speakerId) {
            const speaker = siteData.speakers.find(s => s.id === speakerId);
            if (!speaker) return;

            const modal = document.getElementById('speaker-modal');
            const content = document.getElementById('speaker-detail-content');

            content.innerHTML = `
                <div class="speaker-detail">
                    <div class="speaker-detail-image">
                        ${speaker.photo_url ? `<img src="${speaker.photo_url}" alt="${currentLang === 'zh' ? speaker.name_zh : speaker.name_en}" style="width: 100%; height: 100%; object-fit: cover; border-radius: var(--border-radius);">` : '<i class="fas fa-user"></i>'}
                    </div>
                    <div class="speaker-detail-content">
                        <h3>${currentLang === 'zh' ? speaker.name_zh : speaker.name_en}</h3>
                        <div class="speaker-title">${currentLang === 'zh' ? speaker.title_zh : speaker.title_en}</div>
                        <div class="speaker-org">${currentLang === 'zh' ? speaker.organization_zh : speaker.organization_en}</div>

                        <h4>${currentLang === 'zh' ? '簡介' : 'Bio'}</h4>
                        <p>${currentLang === 'zh' ? speaker.full_bio_zh : speaker.full_bio_en}</p>

                        <h4>${currentLang === 'zh' ? '演講題目' : 'Presentation Topic'}</h4>
                        <p>${currentLang === 'zh' ? speaker.topic_zh : speaker.topic_en}</p>

                        <h4>${currentLang === 'zh' ? '專長領域' : 'Expertise'}</h4>
                        <p>${currentLang === 'zh' ? speaker.expertise_zh : speaker.expertise_en}</p>
                    </div>
                </div>
            `;

            modal.classList.add('show');
        }

        // 初始化報名按鈕
        function initRegisterButtons() {
            const registerBtn = document.getElementById('register-btn');
            const floatingBtn = document.getElementById('floating-register-btn');

            [registerBtn, floatingBtn].forEach(btn => {
                if (btn) {
                    btn.addEventListener('click', showPrivacyModal);
                }
            });
        }

        // 顯示個資宣告 Modal
        function showPrivacyModal() {
            if (siteData.settings.registration_status !== 'open') return;

            const modal = document.getElementById('privacy-modal');
            const title = document.getElementById('privacy-title');
            const content = document.getElementById('privacy-content');
            const checkboxText = document.getElementById('privacy-checkbox-text');
            const checkbox = document.getElementById('privacy-checkbox');
            const confirmBtn = document.getElementById('privacy-confirm');

            if (siteData.privacy) {
                title.textContent = currentLang === 'zh' ? siteData.privacy.title_zh : siteData.privacy.title_en;
                content.innerHTML = currentLang === 'zh' ? siteData.privacy.content_zh : siteData.privacy.content_en;
                checkboxText.textContent = currentLang === 'zh' ? siteData.privacy.checkbox_text_zh : siteData.privacy.checkbox_text_en;
            }

            checkbox.checked = false;
            confirmBtn.disabled = true;

            modal.classList.add('show');
        }

        // 初始化語言切換
        function initLanguage() {
            const langBtns = document.querySelectorAll('.lang-btn');

            langBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const lang = btn.dataset.lang;
                    setLanguage(lang);
                });
            });

            updateLanguageUI();
        }

        // 設定語言
        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('conference-lang', lang);
            updateLanguageUI();
            updateContent();
        }

        // 更新語言UI
        function updateLanguageUI() {
            const langBtns = document.querySelectorAll('.lang-btn');
            langBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === currentLang);
            });
        }

        // 更新內容語言
        function updateContent() {
            updateHero();
            updateCountdown();
            updateRegisterButton();
            renderAbout();
            renderSpeakers();
            renderAgenda();
            renderTraffic();
            renderPastEvents();

            // 更新標題
            updateTitles();
        }

        // 更新所有標題
        function updateTitles() {
            const titles = {
                'about-title': ['會議介紹', 'About Conference'],
                'about-subtitle': ['了解本次會議的詳細內容', 'Learn about the conference details'],
                'speakers-title': ['講師介紹', 'Speakers'],
                'speakers-subtitle': ['來自各領域的專業講師', 'Professional speakers from various fields'],
                'agenda-title': ['會議議程', 'Conference Agenda'],
                'agenda-subtitle': ['完整的會議時程安排', 'Complete conference schedule'],
                'traffic-title': ['交通資訊', 'Transportation'],
                'traffic-subtitle': ['如何前往會場', 'How to get to the venue'],
                'past-events-title': ['歷年會議', 'Past Events'],
                'past-events-subtitle': ['回顧過往精彩活動', 'Review past wonderful events']
            };

            Object.keys(titles).forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.textContent = titles[id][currentLang === 'zh' ? 0 : 1];
                }
            });
        }

        // 初始化手機選單
        function initMobileMenu() {
            const toggle = document.getElementById('mobile-menu-toggle');
            const menu = document.getElementById('navbar-menu');

            toggle.addEventListener('click', () => {
                menu.classList.toggle('mobile-menu-open');
                toggle.classList.toggle('active');
            });

            // 點擊選單項目後關閉手機選單
            const menuLinks = menu.querySelectorAll('.navbar-link');
            menuLinks.forEach(link => {
                link.addEventListener('click', () => {
                    menu.classList.remove('mobile-menu-open');
                    toggle.classList.remove('active');
                });
            });
        }

        // 工具函數
        function showLoading(show) {
            const loading = document.getElementById('loading-state');
            if (show) {
                loading.classList.remove('hidden');
            } else {
                loading.classList.add('hidden');
            }
        }

        function showError(message) {
            alert(message);
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString(currentLang === 'zh' ? 'zh-TW' : 'en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }

        // Modal 事件監聽
        document.getElementById('privacy-modal-close').addEventListener('click', () => {
            document.getElementById('privacy-modal').classList.remove('show');
        });

        document.getElementById('privacy-cancel').addEventListener('click', () => {
            document.getElementById('privacy-modal').classList.remove('show');
        });

        document.getElementById('privacy-checkbox').addEventListener('change', (e) => {
            document.getElementById('privacy-confirm').disabled = !e.target.checked;
        });

        document.getElementById('privacy-confirm').addEventListener('click', () => {
            const formUrl = siteData.settings.registration_form_url;
            if (formUrl) {
                window.open(formUrl, '_blank');
            }
            document.getElementById('privacy-modal').classList.remove('show');
        });

        document.getElementById('speaker-modal-close').addEventListener('click', () => {
            document.getElementById('speaker-modal').classList.remove('show');
        });

        // 點擊 Modal 背景關閉
        document.getElementById('privacy-modal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) {
                e.target.classList.remove('show');
            }
        });

        document.getElementById('speaker-modal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) {
                e.target.classList.remove('show');
            }
        });

        // 平滑滾動到區塊
        document.querySelectorAll('.navbar-link[data-section]').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const section = document.getElementById(link.dataset.section + '-section');
                if (section) {
                    section.scrollIntoView({ behavior: 'smooth' });
                }
            });
        });
    </script>
</body>
</html>
